[package]
name = "rspigot-proxy-plugin"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rspigot-plugin-protocol = { workspace = true }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tokio-stream = "0.1"
tonic = "0.14"
tracing = "0.1"

[dev-dependencies]
rspigot-proxy-core = { workspace = true }
rspigot-proxy-network = { workspace = true }
rspigot-proxy-plugins = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }

[lints]
workspace = true
