[package]
name = "rspigot-anvil"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rspigot-blocks = { workspace = true }
rspigot-core = { workspace = true }
rspigot-domain = { workspace = true }
rspigot-data = { workspace = true }
rspigot-nbt = { workspace = true }
flate2 = "1.1"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
parking_lot = "0.12"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
