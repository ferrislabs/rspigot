[package]
name = "rspigot-rcon"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rspigot-core = { workspace = true }
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "macros", "time", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }

[lints]
workspace = true
