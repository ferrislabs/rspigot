[package]
name = "rspigot-plugin"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rspigot-nbt = { workspace = true }
rspigot-plugin-macros = { workspace = true }
rspigot-plugin-protocol = { workspace = true }
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tokio-stream = "0.1"
tonic = "0.14"
tracing = "0.1"
uuid = "1"

[dev-dependencies]
tempfile = "3"
rspigot-data = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "test-util"] }
trybuild = "1"

[lints]
workspace = true
