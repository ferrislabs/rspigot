[package]
name = "rspigot-worldgen"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rspigot-blocks = { workspace = true }
rspigot-core = { workspace = true }
rspigot-domain = { workspace = true }
rspigot-data = { workspace = true }
rspigot-entities = { workspace = true }
rspigot-nbt = { workspace = true }
flate2 = "1.1"
libm = "0.2"
