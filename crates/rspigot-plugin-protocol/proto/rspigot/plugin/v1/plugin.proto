syntax = "proto3";
package rspigot.plugin.v1;

import "rspigot/plugin/v1/types.proto";
import "rspigot/plugin/v1/events.proto";
import "rspigot/plugin/v1/options.proto";

service PluginHost { rpc Connect(stream FromPlugin) returns (stream ToPlugin); }

enum Access { ACCESS_UNSPECIFIED = 0; ACCESS_OBSERVE = 1; ACCESS_DECIDE = 2; }
enum Priority { PRIORITY_UNSPECIFIED = 0; PRIORITY_LOWEST = 1; PRIORITY_LOW = 2; PRIORITY_NORMAL = 3; PRIORITY_HIGH = 4; PRIORITY_HIGHEST = 5; }
enum Difficulty { DIFFICULTY_UNSPECIFIED = 0; DIFFICULTY_PEACEFUL = 1; DIFFICULTY_EASY = 2; DIFFICULTY_NORMAL = 3; DIFFICULTY_HARD = 4; }
enum Weather { WEATHER_UNSPECIFIED = 0; WEATHER_CLEAR = 1; WEATHER_RAIN = 2; WEATHER_THUNDER = 3; }
enum GameRule { GAME_RULE_UNSPECIFIED = 0; GAME_RULE_DAYLIGHT_CYCLE = 1; GAME_RULE_NATURAL_REGENERATION = 2; GAME_RULE_KEEP_INVENTORY = 3; GAME_RULE_SHOW_DEATH_MESSAGES = 4; GAME_RULE_IMMEDIATE_RESPAWN = 5; GAME_RULE_FALL_DAMAGE = 6; GAME_RULE_MOB_DROPS = 7; GAME_RULE_MOB_GRIEFING = 8; GAME_RULE_MOB_EXPLOSION_DROP_DECAY = 9; GAME_RULE_BLOCK_DROPS = 10; GAME_RULE_UNIVERSAL_ANGER = 11; }

enum Attribute { ATTRIBUTE_UNSPECIFIED = 0; ATTRIBUTE_AIR_DRAG_MODIFIER = 1; ATTRIBUTE_ARMOR = 2; ATTRIBUTE_ARMOR_TOUGHNESS = 3; ATTRIBUTE_ATTACK_DAMAGE = 4; ATTRIBUTE_ATTACK_KNOCKBACK = 5; ATTRIBUTE_ATTACK_SPEED = 6; ATTRIBUTE_BELOW_NAME_DISTANCE = 7; ATTRIBUTE_BLOCK_BREAK_SPEED = 8; ATTRIBUTE_BLOCK_INTERACTION_RANGE = 9; ATTRIBUTE_BOUNCINESS = 10; ATTRIBUTE_BURNING_TIME = 11; ATTRIBUTE_CAMERA_DISTANCE = 12; ATTRIBUTE_EXPLOSION_KNOCKBACK_RESISTANCE = 13; ATTRIBUTE_ENTITY_INTERACTION_RANGE = 14; ATTRIBUTE_FALL_DAMAGE_MULTIPLIER = 15; ATTRIBUTE_FLYING_SPEED = 16; ATTRIBUTE_FOLLOW_RANGE = 17; ATTRIBUTE_FRICTION_MODIFIER = 18; ATTRIBUTE_GRAVITY = 19; ATTRIBUTE_JUMP_STRENGTH = 20; ATTRIBUTE_KNOCKBACK_RESISTANCE = 21; ATTRIBUTE_LUCK = 22; ATTRIBUTE_MAX_ABSORPTION = 23; ATTRIBUTE_MAX_HEALTH = 24; ATTRIBUTE_MINING_EFFICIENCY = 25; ATTRIBUTE_MOVEMENT_EFFICIENCY = 26; ATTRIBUTE_MOVEMENT_SPEED = 27; ATTRIBUTE_NAME_TAG_DISTANCE = 28; ATTRIBUTE_OXYGEN_BONUS = 29; ATTRIBUTE_SAFE_FALL_DISTANCE = 30; ATTRIBUTE_SCALE = 31; ATTRIBUTE_SNEAKING_SPEED = 32; ATTRIBUTE_SPAWN_REINFORCEMENTS = 33; ATTRIBUTE_STEP_HEIGHT = 34; ATTRIBUTE_SUBMERGED_MINING_SPEED = 35; ATTRIBUTE_SWEEPING_DAMAGE_RATIO = 36; ATTRIBUTE_TEMPT_RANGE = 37; ATTRIBUTE_WATER_MOVEMENT_EFFICIENCY = 38; ATTRIBUTE_WAYPOINT_TRANSMIT_RANGE = 39; ATTRIBUTE_WAYPOINT_RECEIVE_RANGE = 40; }
message Transfer { string host = 1; uint32 port = 2; }
message SetAttribute { Attribute attribute = 1; double value = 2; }
message AttributeQuery { int32 entity = 1; Attribute attribute = 2; }
message TypedChange {
  oneof change {
    bool zombie_baby = 1; bool creeper_powered = 2; uint32 sheep_color = 3; bool sheep_sheared = 4; int32 slime_size = 5;
    uint32 villager_profession = 6; uint32 wolf_collar = 7; uint32 cat_collar = 8; uint32 rabbit_variant = 9;
  }
}
message Dust { uint32 color = 1; float scale = 2; }
message Particle { string key = 1; oneof data { string item = 2; string block = 3; Dust dust = 4; } Vec3 position = 5; int32 count = 6; Vec3 spread = 7; double speed = 8; }
message Sound { string key = 1; float volume = 2; float pitch = 3; Vec3 position = 4; }
message Title { string title = 1; optional string subtitle = 2; int32 fade_in = 3; int32 stay = 4; int32 fade_out = 5; }
message TabList { string header = 1; string footer = 2; }
message Facing { Vec3 position = 1; Rotation rotation = 2; }
message BanTerms { optional string reason = 1; optional int64 expires_ms = 2; }
message Ban { string target = 1; optional string reason = 2; optional int64 expires_ms = 3; }
message SetSlot { int32 slot = 1; Item item = 2; }
message RemoveItems { string key = 1; int32 count = 2; }
enum WorldDimension { WORLD_DIMENSION_UNSPECIFIED = 0; OVERWORLD = 1; NETHER = 2; END = 3; }
message WorldLayer { string block = 1; uint32 height = 2; }
message FlatLayers { repeated WorldLayer layers = 1; }
message WorldGenerator { oneof kind { Empty vanilla = 1; FlatLayers flat = 2; Empty void = 3; string datapack = 4; } }
message CreateWorld { string name = 1; WorldDimension dimension = 2; int64 seed = 3; WorldGenerator generator = 4; bool structures = 5; }
message DeleteWorld { bool files = 1; }
message CreateInventory { uint64 id = 1; int32 rows = 2; string title = 3; bool locked = 4; }
message SetGameRule { GameRule rule = 1; bool value = 2; }
message Explode { Vec3 position = 1; float power = 2; bool breaks_blocks = 3; }
message SetBlockWith { string block = 1; repeated Property properties = 2; }

message Handler { uint32 id = 1; EventKind event = 2; Access access = 3; Priority priority = 4; bool ignore_cancelled = 5; }
enum ArgumentKind { ARGUMENT_KIND_UNSPECIFIED = 0; ARGUMENT_KIND_PLAYER = 1; ARGUMENT_KIND_ITEM = 2; ARGUMENT_KIND_INTEGER = 3; ARGUMENT_KIND_TEXT = 4; ARGUMENT_KIND_BOOLEAN = 5; }
message CommandArgument { string name = 1; ArgumentKind kind = 2; bool optional = 3; bool suggested = 4; }
message CommandSpec { uint32 id = 1; string name = 2; optional string permission = 3; repeated CommandArgument arguments = 4; }
message ArgumentValue { oneof value { PlayerSnapshot player = 1; string item = 2; int64 integer = 3; string text = 4; bool flag = 5; } }
message Invocation { uint32 command = 1; PlayerSnapshot sender = 2; repeated ArgumentValue arguments = 3; }
message Hello { uint32 protocol_version = 1; string name = 2; string version = 3; string token = 4; repeated Handler handlers = 5; repeated CommandSpec commands = 6; }
message PlayerState {
  PlayerSnapshot player = 1; float health = 2; int32 food = 3; int32 level = 4; float max_health = 5; float absorption = 6;
  float saturation = 7; float exhaustion = 8; float exp = 9; int32 total_exp = 10; bool op = 11; bool allow_flight = 12;
  bool flying = 13; float fly_speed = 14; float walk_speed = 15; bool sneaking = 16; bool sprinting = 17; bool on_ground = 18;
  int32 fire_ticks = 19; bool dead = 20; repeated Effect effects = 21; int32 ping = 22; string locale = 23; string address = 24;
  repeated string hidden = 25;
}
message Verdict { uint32 handler = 1; bool cancel = 2; Patch patch = 3; }
message Decision { uint64 event = 1; reserved 2; repeated Verdict verdicts = 3; }

message DialogInput { string key = 1; string label = 2; string initial = 3; uint32 max_length = 4; bool multiline = 5; }
message DialogButton { string label = 1; string id = 2; }
message Dialog { string title = 1; repeated string body = 2; repeated DialogInput inputs = 3; repeated DialogButton buttons = 4; bool can_close_with_escape = 5; }

message RichClick { oneof action { string run_command = 1; string suggest_command = 2; string open_url = 3; string copy_to_clipboard = 4; string custom = 5; } }
message RichPart { string text = 1; optional string hover = 2; optional RichClick click = 3; }
message RichMessage { repeated RichPart parts = 1; }

message PlayerOrder {
  string player = 1;
  oneof order {
    string send_message = 10 [(rspigot.path) = "player.message.send"]; string send_action_bar = 11 [(rspigot.path) = "player.action_bar.send"]; Title send_title = 12 [(rspigot.path) = "player.title.send"]; Empty reset_title = 13 [(rspigot.path) = "player.title.reset"]; TabList set_tab_list = 14 [(rspigot.path) = "player.tab_list.set"];
    Vec3 teleport = 15; Facing teleport_facing = 16; GameMode set_game_mode = 17 [(rspigot.path) = "player.game_mode.set"]; string kick = 18 [(rspigot.path) = "player.connection.kick"];
    float set_health = 19 [(rspigot.path) = "player.health.set"]; float set_absorption = 20 [(rspigot.path) = "player.health.set_absorption"]; double damage = 21 [(rspigot.path) = "player.health.damage"]; Empty kill = 22 [(rspigot.path) = "player.health.kill"];
    int32 set_food_level = 23 [(rspigot.path) = "player.food.set_level"]; float set_saturation = 24 [(rspigot.path) = "player.food.set_saturation"]; float set_exhaustion = 25 [(rspigot.path) = "player.food.set_exhaustion"];
    int32 give_exp = 26 [(rspigot.path) = "player.experience.give"]; int32 give_levels = 27 [(rspigot.path) = "player.experience.give_levels"]; int32 set_level = 28 [(rspigot.path) = "player.experience.set_level"]; float set_exp = 29 [(rspigot.path) = "player.experience.set_progress"];
    Effect add_effect = 30 [(rspigot.path) = "player.effects.add"]; string remove_effect = 31 [(rspigot.path) = "player.effects.remove"]; Empty clear_effects = 32 [(rspigot.path) = "player.effects.clear"]; int32 set_fire_ticks = 33 [(rspigot.path) = "player.health.set_fire_ticks"]; Vec3 set_velocity = 34 [(rspigot.path) = "player.movement.set_velocity"];
    bool set_allow_flight = 35 [(rspigot.path) = "player.abilities.set_allow_flight"]; bool set_flying = 36 [(rspigot.path) = "player.abilities.set_flying"]; float set_fly_speed = 37 [(rspigot.path) = "player.abilities.set_fly_speed"]; float set_walk_speed = 38 [(rspigot.path) = "player.abilities.set_walk_speed"]; bool set_op = 39 [(rspigot.path) = "player.operator.set"];
    Empty respawn = 40 [(rspigot.path) = "player.health.respawn"]; string perform_command = 41 [(rspigot.path) = "player.command.perform"]; string chat = 42 [(rspigot.path) = "player.message.chat"]; Sound play_sound = 43 [(rspigot.path) = "player.sound.play"]; Particle spawn_particle = 44 [(rspigot.path) = "player.particle.spawn"];
    string hide_player = 45 [(rspigot.path) = "player.visibility.hide"]; string show_player = 46 [(rspigot.path) = "player.visibility.show"]; uint64 open_inventory = 47; Empty close_inventory = 48 [(rspigot.path) = "player.inventory.close"]; Empty update_inventory = 49 [(rspigot.path) = "player.inventory.update"];
    BanTerms ban = 50 [(rspigot.path) = "player.connection.ban"]; Location teleport_to = 51; uint32 set_scoreboard = 52 [(rspigot.path) = "player.scoreboard.set"]; Transfer transfer = 53;
    Dialog show_dialog = 54 [(rspigot.path) = "player.dialog.show"]; Empty clear_dialog = 55 [(rspigot.path) = "player.dialog.clear"];
    RichMessage send_rich_message = 56 [(rspigot.path) = "player.message.send_rich"];
    MetaOrder meta = 57;
  }
}
message InventoryOrder { string player = 1; oneof order { Item add = 10 [(rspigot.path) = "player.inventory.add"]; SetSlot set = 11 [(rspigot.path) = "player.inventory.set"]; RemoveItems remove = 12 [(rspigot.path) = "player.inventory.remove"]; Empty clear = 13 [(rspigot.path) = "player.inventory.clear"]; int32 set_held_slot = 14 [(rspigot.path) = "player.inventory.set_held_slot"]; } }
message ServerOrder {
  oneof order {
    string broadcast = 10 [(rspigot.path) = "server.message.broadcast"]; string dispatch_command = 11 [(rspigot.path) = "server.command.dispatch"]; Empty shutdown = 12 [(rspigot.path) = "server.lifecycle.shutdown"]; Empty save = 13 [(rspigot.path) = "server.lifecycle.save"]; bool set_whitelist_enabled = 14 [(rspigot.path) = "server.whitelist.set_enabled"];
    string whitelist_add = 15 [(rspigot.path) = "server.whitelist.add"]; string whitelist_remove = 16 [(rspigot.path) = "server.whitelist.remove"]; string operator_add = 17 [(rspigot.path) = "server.operators.add"]; string operator_remove = 18 [(rspigot.path) = "server.operators.remove"];
    Ban ban_add = 19 [(rspigot.path) = "server.bans.add"]; string ban_remove = 20 [(rspigot.path) = "server.bans.remove"]; Ban ip_ban_add = 21 [(rspigot.path) = "server.ip_bans.add"]; string ip_ban_remove = 22 [(rspigot.path) = "server.ip_bans.remove"]; CreateInventory create_inventory = 23; CreateWorld create_world = 24;
  }
}
message WorldOrder {
  oneof order {
    int64 set_time = 10 [(rspigot.path) = "world.time.set"]; Weather set_weather = 11 [(rspigot.path) = "world.weather.set"]; Difficulty set_difficulty = 12 [(rspigot.path) = "world.difficulty.set"]; BlockPos set_spawn = 13 [(rspigot.path) = "world.spawn_point.set"]; bool set_pvp = 14 [(rspigot.path) = "world.pvp.set"];
    SetGameRule set_game_rule = 15 [(rspigot.path) = "world.game_rule.set"]; Empty save = 16 [(rspigot.path) = "world.storage.save"]; Sound play_sound = 17 [(rspigot.path) = "world.sound.play"]; Particle spawn_particle = 18 [(rspigot.path) = "world.particle.spawn"]; Explode explode = 19 [(rspigot.path) = "world.explosion.create"]; DeleteWorld delete_world = 20;
  }
}
message MetaOrder { bool volatile = 1; oneof change { MetaEntry set = 10; string remove = 11; Empty clear = 12; } }
message EquipmentEdit { string slot = 1; optional Item item = 2; }
message DropChanceEdit { string slot = 1; float chance = 2; }
message EntityEdit {
  oneof edit {
    string set_custom_name = 1; Empty clear_custom_name = 2; bool set_custom_name_visible = 3; bool set_glowing = 4; bool set_invisible = 5;
    bool set_silent = 6; bool set_gravity = 7; bool set_invulnerable = 8; bool set_persistent = 9; int32 set_fire_ticks = 10;
    int32 set_freeze_ticks = 11; int32 set_air = 12; float set_fall_distance = 13; Rotation set_rotation = 14; Vec3 look_at = 15;
    int32 set_ticks_lived = 16; string add_tag = 17; string remove_tag = 18;
    int32 mount = 19; Empty dismount = 20; Empty eject_passengers = 21;
    float set_health = 22; float set_absorption = 23; bool set_ai = 24; bool set_can_pick_up_loot = 25; bool set_left_handed = 26;
    EquipmentEdit set_equipment = 27; DropChanceEdit set_drop_chance = 28;
    int32 set_leash_holder = 29; Empty clear_leash = 30;
    string set_owner = 31; Empty clear_owner = 32; bool set_tamed = 33; bool set_sitting = 34;
    int32 set_target = 35; Empty clear_target = 36;
    int32 set_age = 37; bool set_age_locked = 38; bool set_breeding = 39;
  }
}
message SignLines { bool front = 1; repeated string lines = 2; }
message SignStyle { bool front = 1; optional string color = 2; optional bool glowing = 3; }
message FurnaceEdit { optional int32 burn_time = 1; optional int32 cook_time = 2; optional int32 cook_time_total = 3; }
message SpawnerEdit {
  optional string entity = 1; optional int32 delay = 2; optional int32 min_delay = 3; optional int32 max_delay = 4; optional int32 spawn_count = 5;
  optional int32 max_nearby = 6; optional int32 required_player_range = 7; optional int32 spawn_range = 8;
}
message SkullOwner { optional string name = 1; optional string uuid = 2; }
message BannerPattern { string pattern = 1; string color = 2; }
message BannerPatterns { repeated BannerPattern patterns = 1; }
message CommandEdit { optional string command = 1; optional string name = 2; }
message BeaconEffects { optional string primary = 1; optional string secondary = 2; }
message PotSherds { repeated string sherds = 1; }
message GatewayExit { BlockPos exit = 1; bool exact = 2; }
message TileEdit {
  oneof edit {
    SignLines sign_lines = 1; SignStyle sign_style = 2; bool sign_waxed = 3;
    SetSlot inventory_set = 4; Item inventory_add = 5; Empty inventory_clear = 6;
    FurnaceEdit furnace = 7; SpawnerEdit spawner = 8; SkullOwner skull_owner = 9; BannerPatterns banner_patterns = 10;
    CommandEdit command_block = 11; BeaconEffects beacon = 12; Item jukebox_disc = 13; Empty jukebox_clear = 14;
    GatewayExit end_gateway = 15; Item lectern_book = 16; Empty lectern_clear = 17; PotSherds decorated_pot = 18;
  }
}
message BlockDataEdit { repeated Property properties = 1; }
message BlockOrder { BlockPos pos = 1; oneof order { string set = 10; SetBlockWith set_with = 11; Empty break_naturally = 12; MetaOrder meta = 13; BlockDataEdit set_data = 14; TileEdit tile = 15; } }
message EntityOrder { int32 entity = 1; oneof order { Vec3 teleport = 10; Empty remove = 11; double damage = 12; Empty kill = 13; Effect add_effect = 14; string remove_effect = 15; Empty clear_effects = 16; Vec3 set_velocity = 17; SetAttribute set_attribute = 18; TypedChange change = 19; MetaOrder meta = 20; EntityEdit edit = 21; } }
message RegisterObjective { string name = 1; string criteria = 2; string display_name = 3; }
message ObjectiveText { string objective = 1; string text = 2; }
message ObjectiveRender { string objective = 1; bool hearts = 2; }
message DisplaySlotOrder { string slot = 1; optional string objective = 2; }
message ScoreOrder { string entry = 1; string objective = 2; int32 value = 3; }
message ResetScoreOrder { string entry = 1; optional string objective = 2; }
message TeamOption {
  string team = 1;
  oneof option {
    string display_name = 10; string prefix = 11; string suffix = 12; string color = 13; bool friendly_fire = 14;
    bool see_friendly_invisibles = 15; string nametag_visibility = 16; string death_message_visibility = 17; string collision_rule = 18;
  }
}
message TeamEntry { string team = 1; string entry = 2; bool join = 3; }
message ScoreboardOrder {
  uint32 board = 1;
  oneof order {
    RegisterObjective register_objective = 10; string unregister_objective = 11; ObjectiveText set_objective_display_name = 12;
    ObjectiveRender set_objective_render = 13; DisplaySlotOrder set_display_slot = 14; ScoreOrder set_score = 15;
    ResetScoreOrder reset_score = 16; string register_team = 17; string unregister_team = 18; TeamOption set_team_option = 19;
    TeamEntry team_entry = 20; Empty discard = 21;
  }
}
message BossFlagOrder { string flag = 1; bool enabled = 2; }
message BossBarOrder {
  uint64 bar = 1;
  oneof order {
    string set_title = 10; string set_color = 11; string set_style = 12; double set_progress = 13; BossFlagOrder set_flag = 14;
    string add_player = 15; string remove_player = 16; Empty remove_all_players = 17; bool set_visible = 18; Empty remove = 19;
  }
}
message BossBarCreate { string title = 1; string color = 2; string style = 3; repeated string flags = 4; optional string key = 5; }
message CustomInventoryOrder { uint64 inventory = 1; oneof order { SetSlot set = 10; Empty clear = 11; Empty close = 12; Empty discard = 13; } }

message NpcSkin { string value = 1; string signature = 2; }
message NpcSpec { string key = 1; string name = 2; Vec3 position = 3; optional Rotation rotation = 4; optional NpcSkin skin = 5; optional uint32 skin_layers = 6; }
message NpcEquipment { string slot = 1; optional Item item = 2; }
message NpcGaze { double range = 1; }
message NpcWalk { Vec3 target = 1; double speed = 2; }
message NpcOrder {
  int32 npc = 1;
  oneof order {
    Vec3 teleport = 10; Empty remove = 11; NpcSkin set_skin = 12; Rotation set_rotation = 13; string set_pose = 14;
    NpcEquipment set_equipment = 15; Empty swing_main_hand = 16; Empty swing_off_hand = 17; Vec3 look_at = 18;
    NpcGaze look_at_nearest = 19; uint32 set_skin_layers = 20; string set_label = 21; string hide_from = 22; string show_to = 23; NpcWalk walk_to = 24; Empty stop_walking = 25;
  }
}
message TargetQuery { string player = 1; double max_distance = 2; }
message Near { Vec3 position = 1; double radius = 2; }
message EntityQuery { Near near = 1; optional string kind = 2; }
message Spawn { string kind = 1; Vec3 position = 2; optional string block = 3; optional Vec3 velocity = 4; }
message DropItem { Vec3 position = 1; Item item = 2; }
message MetaQuery { oneof holder { int32 entity = 1; BlockPos block = 2; string player = 5; } optional string key = 3; bool volatile = 4; }
message FindBlocks { string key = 1; optional MetaValue value = 2; bool volatile = 3; }
message EntitiesWithMeta { string key = 1; bool volatile = 2; }
message Question {
  uint64 request = 1;
  oneof question {
    string player = 10; Empty players = 11; string player_named = 12; string inventory = 13;
    TargetQuery target_block = 14; TargetQuery target_entity = 15; Empty server = 16; Empty whitelist = 17;
    Empty operators = 18; Empty bans = 19; Empty ip_bans = 20; Empty world = 21; EntityQuery entities = 22;
    int32 entity = 23; BlockPos block = 24; Spawn spawn = 25; DropItem drop_item = 26; uint64 custom_inventory = 27; uint32 scoreboard = 28; Empty new_scoreboard = 29;
    BossBarCreate create_boss_bar = 30; uint64 boss_bar = 31; Empty boss_bars = 32; AttributeQuery attribute_value = 33;
    NpcSpec create_npc = 34; string npc_by_key = 35; Empty npcs = 36; int32 npc = 37;
    MetaQuery meta = 38; FindBlocks find_blocks = 39; EntitiesWithMeta entities_with_meta = 40; EntitiesWithMeta players_with_meta = 41;
    BlockPos tile = 42; BlockPos block_info = 43;
  }
}
message FromPlugin {
  oneof body {
    Hello hello = 1; Decision decision = 2; PlayerOrder player = 3; InventoryOrder inventory = 4; ServerOrder server = 5;
    WorldOrder world = 6; BlockOrder block = 7; EntityOrder entity = 8; CustomInventoryOrder custom_inventory = 9; Question question = 10;
    ScoreboardOrder scoreboard = 12; BossBarOrder boss_bar = 13; NpcOrder npc = 16;
  }
  optional uint64 origin = 11;
  optional uint64 request = 14;
  optional string in_world = 15;
}

enum ActionErrorKind {
  ACTION_ERROR_KIND_UNSPECIFIED = 0; INVALID_ARGUMENT = 1; TARGET_GONE = 2; INCOMPATIBLE_STATE = 3; CANCELLED = 4; NOT_FOUND = 5; LIMIT_REACHED = 6;
}
message ActionError { ActionErrorKind kind = 1; string reason = 2; }
message Accepted {}
message NotFound {}
message Refused { string reason = 1; }
message PlayerList { repeated PlayerSnapshot players = 1; }
message InventoryState { repeated Slot slots = 1; int32 held_slot = 2; }
message BlockHit { BlockPos pos = 1; Face face = 2; string block = 3; }
message Target { oneof hit { BlockHit block = 1; PlayerSnapshot player = 2; EntitySnapshot entity = 3; NpcState npc = 4; } }
message ServerState { int32 max_players = 1; int32 online = 2; double tps_1m = 3; double tps_5m = 4; double tps_15m = 5; bool whitelist_enabled = 6; }
message ListedPlayer { string name = 1; optional string uuid = 2; }
message ListedPlayers { repeated ListedPlayer players = 1; }
message BanEntry { string target = 1; optional string uuid = 2; int64 created_ms = 3; string source = 4; optional int64 expires_ms = 5; optional string reason = 6; }
message BanList { repeated BanEntry entries = 1; }
message GameRuleValue { GameRule rule = 1; bool value = 2; }
message WorldState { string name = 1; optional string uuid = 2; int64 seed = 3; int64 day_time = 4; int64 game_time = 5; bool raining = 6; bool thundering = 7; Difficulty difficulty = 8; BlockPos spawn = 9; bool pvp = 10; repeated GameRuleValue rules = 11; }
message EntityList { repeated EntitySnapshot entities = 1; }
message EquipmentState { string slot = 1; optional Item item = 2; float drop_chance = 3; }
message LivingExtra {
  float max_health = 1; float absorption = 2; bool ai = 3; bool can_pick_up_loot = 4; bool left_handed = 5; repeated EquipmentState equipment = 6;
  optional int32 leash_holder = 7; optional string owner = 8; bool tamed = 9; bool sitting = 10; optional int32 target = 11;
  int32 age = 12; bool age_locked = 13; bool baby = 14; bool in_love = 15;
}
message EntityState { EntitySnapshot entity = 1; optional float health = 2; Vec3 velocity = 3; bool on_ground = 4; optional string custom_name = 5; int32 fire_ticks = 6; bool custom_name_visible = 7; bool glowing = 8; bool invisible = 9; bool silent = 10; bool gravity = 11; bool invulnerable = 12; bool persistent = 13; int32 freeze_ticks = 14; int32 air = 15; float fall_distance = 16; Rotation rotation = 17; int32 ticks_lived = 18; repeated string tags = 19; repeated int32 passengers = 20; optional int32 vehicle = 21; optional LivingExtra living = 22; }
message CustomInventoryState { repeated Slot slots = 1; repeated PlayerSnapshot viewers = 2; }
message ObjectiveState { string name = 1; string criteria = 2; string display_name = 3; bool hearts = 4; bool read_only = 5; }
message ScoreState { string entry = 1; string objective = 2; int32 value = 3; }
message TeamState {
  string name = 1; string display_name = 2; string prefix = 3; string suffix = 4; optional string color = 5; bool friendly_fire = 6;
  bool see_friendly_invisibles = 7; string nametag_visibility = 8; string death_message_visibility = 9; string collision_rule = 10;
  repeated string entries = 11;
}
message SlotState { string slot = 1; string objective = 2; }
message ScoreboardState { repeated ObjectiveState objectives = 1; repeated ScoreState scores = 2; repeated TeamState teams = 3; repeated SlotState slots = 4; }
message BossBarState {
  uint64 bar = 1; optional string key = 2; string title = 3; string color = 4; string style = 5; double progress = 6;
  repeated string flags = 7; bool visible = 8; repeated string players = 9;
}
message BossBarList { repeated BossBarState bars = 1; }
message NpcState {
  int32 entity_id = 1; string uuid = 2; string key = 3; string name = 4; string world = 5; Vec3 position = 6; Rotation rotation = 7;
  optional NpcSkin skin = 8; uint32 skin_layers = 9; string pose = 10; double gaze_range = 11; optional string label = 12; bool walking = 13;
}
message SignState { repeated string front = 1; repeated string back = 2; bool waxed = 3; string front_color = 4; string back_color = 5; bool front_glowing = 6; bool back_glowing = 7; }
message InventoryContents { int32 size = 1; repeated Slot slots = 2; }
message FurnaceState { int32 burn_time = 1; int32 cook_time = 2; int32 cook_time_total = 3; bool lit = 4; InventoryContents contents = 5; }
message SpawnerState { string entity = 1; int32 delay = 2; int32 min_delay = 3; int32 max_delay = 4; int32 spawn_count = 5; int32 max_nearby = 6; int32 required_player_range = 7; int32 spawn_range = 8; }
message CommandState { string command = 1; string name = 2; }
message BeaconState { int32 levels = 1; optional string primary = 2; optional string secondary = 3; }
message DiscState { optional Item item = 1; }
message TileState {
  string kind = 1;
  oneof state {
    SignState sign = 2; InventoryContents inventory = 3; FurnaceState furnace = 4; SpawnerState spawner = 5; SkullOwner skull = 6;
    BannerPatterns banner = 7; CommandState command_block = 8; BeaconState beacon = 9; DiscState jukebox = 10; DiscState lectern = 11;
    GatewayExit end_gateway = 12; PotSherds decorated_pot = 13;
  }
}
message BlockInfo { int32 light = 1; int32 sky_light = 2; int32 block_light = 3; int32 power = 4; string biome = 5; }
message MetaEntries { repeated MetaEntry entries = 1; }
message BlockPositions { repeated BlockPos positions = 1; }
message NpcList { repeated NpcState npcs = 1; }
message Answer {
  uint64 request = 1;
  oneof body {
    PlayerState player = 2; PlayerList players = 3; NotFound not_found = 4; Refused refused = 5; InventoryState inventory = 6;
    Target target = 7; ServerState server = 8; ListedPlayers listed = 9; BanList bans = 10; WorldState world = 11; BlockState block = 12;
    EntityList entities = 13; EntityState entity = 14; EntitySnapshot spawned = 15; CustomInventoryState custom_inventory = 16;
    ScoreboardState scoreboard = 17; uint32 scoreboard_created = 18; uint64 boss_bar_created = 19; BossBarState boss_bar = 20; BossBarList boss_bars = 21;
    Empty done = 22; ActionError failed = 23; string world_created = 24; double attribute_value = 25;
    NpcState npc = 26; NpcList npcs = 27; MetaEntries meta_entries = 28; BlockPositions block_positions = 29; TileState tile = 30; BlockInfo block_info = 31;
  }
}
message Warning { string message = 1; }
message Replaced {}
message ToPlugin { oneof body { Accepted accepted = 1; Event event = 2; Answer answer = 3; Warning warning = 4; Replaced replaced = 5; Invocation invocation = 6; } }
