[package]
name = "rspigot-core"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rspigot-ai = { workspace = true }
rspigot-blocks = { workspace = true }
rspigot-data = { workspace = true }
rspigot-domain = { workspace = true }
rspigot-entities = { workspace = true }
rspigot-items = { workspace = true }
rspigot-nbt = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
crossbeam-channel = "0.5"
futures-channel = "0.3"
parking_lot = "0.12"
rand = "0.10"
rustc-hash = "2"
serde_json = "1"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
thiserror = "2"
tracing = "0.1"
uuid = "1"
thread-priority = "3.1.1"

[dev-dependencies]
rspigot-anvil = { workspace = true }
rspigot-worldgen = { workspace = true }
proptest = "1"
rsa = { version = "0.9.10", default-features = false, features = ["std", "u64_digit"] }
sha1 = "0.11.0"
sha2 = "0.11"

[lints]
workspace = true
