[events.BlockMultiPlace]
extra = [
    { name = "placed_state", java = "org.bukkit.block.BlockState", number = 100, reason = "rspigot asks before the world changes, so the placed block still shows its old state: this is the state it will get" },
    { name = "placed_states", java = "java.util.List<org.bukkit.block.BlockState>", number = 101, reason = "the states every captured block will get, in capture order" },
