InventoryBlockStart = "base class of CampfireStart and BrewingStart, never fired on its own"
PrepareInventoryResult = "base class of the prepare events, never fired on its own"
PlayerRegisterChannel = "Java plugin channels do not exist for out-of-process plugins"
PlayerUnregisterChannel = "Java plugin channels do not exist for out-of-process plugins"
