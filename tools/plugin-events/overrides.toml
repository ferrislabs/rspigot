[fired]
BellResonate = "a bell, a few ticks after it was rung, with a raider (pillager, vindicator, evoker, illusioner, ravager or witch) within 32 blocks, once its resonance has lasted 40 ticks; resonated_entities lists the raiders in range, which then glow for 3 seconds; not cancellable, and the list is not read back"
BellRing = "a bell rung by a redstone signal (the facing of the bell as direction, no entity), or by a player clicking a ringable side of it (the clicked side as direction, the player as entity), asked before the sound and the shaking; a cancel keeps the bell silent; a bell struck by an arrow does not ring yet"
BlockDispense = "a powered dispenser or dropper four ticks later, for the item it picked at random among its stacks, asked before it acts: the item is the single item dispensed and the velocity is the launch vector (a randomised throw for a dropped item, the facing plus 0.1 up for an arrow, an egg, a snowball or a bottle, the target block position for TNT, nothing for the others); a cancel keeps the item in the dispenser; a patched item of another kind is dispensed with the behavior of that kind; a patched velocity is used by the dropped items and the projectiles; a dropper pushing into a container (a chest minecart, a brewing stand or a jukebox included) asks InventoryMoveItem instead; minecarts and boats go on a rail or on the water in front (the velocity is the spot where they appear), armor stands and the mob of a spawn egg appear in the block in front, a glass bottle fills from water or from a full hive, a water bottle turns dirt into mud, and powder snow is poured, all with the velocity of the vanilla event; fireworks, shulker boxes, honeycombs, glowstone, wither skulls, carved pumpkins, brushes and the other buckets are only dropped"
BlockDispenseArmor = "a dispenser holding an armor piece (helmet, chestplate, leggings or boots) facing a living mob whose slot for it is free, asked before the armor is put on, instead of BlockDispense; target_entity is the first such mob in the block in front; a cancel keeps the item in the dispenser; players and armor stands are not dressed yet"
BlockShearEntity = "a dispenser holding shears facing a sheep or a mooshroom ready to be sheared, asked before the wool drops; a cancel keeps the animal and the shears; allowed, the shears lose one durability; beehives are not sheared by dispensers yet"
CrafterCraft = "a powered crafter four ticks later, with the grid matching a crafting recipe, asked before the ingredients are used; recipe is the id of the recipe, result the item it makes and remaining_items the containers left behind (buckets, bottles); a patched result replaces the item dropped or pushed into the container in front; a cancel keeps every ingredient; the crafter has no window yet, so its slots are filled by hoppers and droppers, which skip the disabled slots saved in the block entity and balance the stacks as the vanilla container does; a disabled slot cannot be toggled by a player"
HopperInventorySearch = "a hopper looking for the container it will push into (the block it faces, DESTINATION) or pull from (the block above, SOURCE), each time it tries to move items, with the inventory found or none; a patched inventory that is a block container replaces the search result, a null one clears it; chests, double chests, barrels, shulker boxes, hoppers, droppers, dispensers, furnaces and crafters are found, minecart containers are not"
InventoryClick = "every click of the player inventory, a vanilla container or a plugin inventory; a spectator's click starts denied and a later handler can let it through; a click in a locked plugin inventory is born cancelled and not asked; a refused click is resent through the generic resync, and set_current_item or set_cursor on a slot or cursor that changed while the event waited refuses the click and resends the window"
InventoryClose = "when the player or the server closes any window, the player inventory included, before the grid and the cursor go back"
CraftItem = "a click on the result of the player grid or of a crafting table whose grid has a recipe, which is its datapack id; the whole window is resent after it"
InventoryMoveItem = "a hopper pushing one of its items into the container it faces, or pulling one from the container above it (a brewing stand by face, a chest or hopper minecart, a jukebox), a hopper minecart pulling every tick, and a dropper pushing an item into the container in front of it, asked before the item moves; the item is a single item, the initiator is the hopper or the dropper; a cancel keeps the item and restarts the hopper cooldown; a patched item is what reaches the destination while the source loses the original; asked only for a move the destination would accept"
InventoryPickupItem = "a hopper, or a hopper minecart, sucking in an item entity lying in the block above it, asked before the item is taken; a cancel leaves the item on the ground; a cancelled entity is not tried again that tick; the entity is removed once it fits entirely, a partial fit leaves the rest on the ground"
NotePlay = "a note block played by a redstone signal rising, a right click that raises its note, or a left click on it, asked before the sound; the instrument follows the block under it (or the head above it) and the note is its 0 to 24 pitch; a cancel keeps the sound and the particle back; the instrument of the block under it is approximated from its name (stone like blocks, wood, sand, glass, wool, metals, copper, hay)"
SmithItem = "a click on the smithing result while it holds an item; the whole window is resent after it"
InventoryCreative = "creative slot packets that place a different item or drop one; ALLOW lets an oversized stack through"
InventoryDrag = "the end of a drag only, the start and the added slots wait in the player lane; a refusal keeps the old cursor and ignores set_cursor"
InventoryOpen = "vanilla containers and plugin inventories, never the player inventory; the open window closes with its InventoryClose before the ask, so a refusal shows no screen"
PrepareItemCraft = "once per click that changes the player grid or a crafting table grid; the client sees no result until the event settles when a decider answers, and a shift-click on the result asks it again between two crafts"
PrepareSmithing = "once per click that changes the inputs into a smithing recipe; the client sees no result until the event settles when a decider answers"
PrepareAnvil = "once per click that changes the two inputs and per RenameItem that changes the typed name, also with an empty result, as AnvilMenu.createResult does; the client sees no result until the event settles when a decider answers, a patch replaces the result without changing the level cost"
PrepareGrindstone = "once per click that changes the two inputs, also with an empty result, as GrindstoneMenu.createResult does; the client sees no result until the event settles when a decider answers"
PrepareItemEnchant = "once per click that changes the item or the lapis in an enchanting table holding an item, as slotsChanged does, with the three offers (enchantment, level and cost, only the offers that have a clue) and the count of bookshelves as enchantment_bonus; the offers show no cost until the event settles when a decider answers, and a cancel clears them; an item that cannot be enchanted (nothing to enchant, or already enchanted) asks nothing; the offers are not read back, so a plugin cannot rewrite them"
EnchantItem = "a click on an offer button of an enchanting table whose item, lapis and levels allow it, asked before anything is spent: enchants_to_add is the list the offer would add, exp_level_cost the cost shown (a patch sets it, and the click is refused when the player has fewer levels), level_hint and enchantment_hint the clue; a cancel keeps the item, the lapis and the levels; allowed, the item is enchanted (a book becomes an enchanted book), the lapis and the levels paid are the button number plus one, the player gets a new enchantment seed, and the table asks PrepareItemEnchant again; the map is not read back"
BrewingStandFuel = "a brewing stand with no fuel left and blaze powder in its fuel slot, on its tick, asked before the powder is used; fuel_power is the 20 uses the powder gives and consuming whether one powder is taken; a patch sets both; a cancel keeps the powder and the stand idle for that tick, and asks again on the next"
BrewingStart = "a brewing stand with fuel starting a brew (a reagent in the ingredient slot and a bottle that has a recipe), asked after one use of fuel is spent; total_brew_time is the 400 ticks of a brew, and a patch sets it as is; source is the ingredient"
Brew = "a brewing stand whose brew time ran out with a recipe still valid, asked before the bottles change; results are the three output slots (an empty slot or a bottle with no recipe keeps its content, and only filled slots are listed); a cancel keeps the bottles and the ingredient; fuel_level is the fuel left; the results are not read back; the brewing recipes are the datapack ones, and a hopper does not feed or empty a stand yet"
PlayerItemMend = "an experience orb touching a player who wears or holds a damaged item with mending, picked at random among the main hand, the off hand and the four armor slots, asked before the repair; repair_amount is two durability per point of the orb, capped by the damage, and a patch sets it; a cancel keeps the item and the orb gives the player its points; allowed, the points not used (what the repair did not take) feed the next mending item, then reach the player through PlayerExpChange"
FurnaceBurn = "in a keyed lane per furnace, which stops while it is asked; a refusal leaves the block lit and set_burning false burns without using the fuel, as in Spigot"
FurnaceStartSmelt = "carries the cook time the server uses, with the blast furnace and smoker speed, and a patch sets it as is"
FurnaceSmelt = "also reaches BlockCook handlers; a refusal loses the progress without output, and a patched result unlike the output smelts nothing"
FurnaceExtract = "one per recipe used, also for 0 experience, with the amount taken; a take by number key fires BlockExp instead, as in Spigot, and a furnace break never fires it"
PlayerJoin = "the join message is announced once the event settles"
PlayerQuit = "the quit message is announced once the event settles, after the player is removed"
AsyncPlayerPreLogin = "the login waits for the core; a refusal ends it with the literal kick message"
PlayerLogin = "hostname is empty and the real address is the remote address, neither is tracked"
PlayerKick = "every server-side disconnect of a player in game, never at shutdown or during the login"
PlayerLocaleChange = "at join when the locale is not en_us and on every settings packet that changes it"
PlayerChangedMainHand = "carries the old hand, as the Spigot bytecode does"
PlayerCommandSend = "at join, at respawn and when the operator status changes; only root commands can be removed"
AsyncPlayerChat = "from chat packets and plugin chat orders; the display name is the profile name and there is no chat visibility or text filter"
PlayerCommandPreprocess = "from command packets and plugin chat orders starting with /, not from perform_command"
PlayerMove = "observers and deciding handlers; a changed to moves the player through PlayerTeleport (PLUGIN), only its position applies"
PlayerTeleport = "COMMAND for /tp and PLUGIN for plugin orders and a changed PlayerMove destination; never at respawn"
PlayerVelocity = "at the velocity sync and when a player hits a player; asked only when a deciding handler exists, one at a time"
PlayerRespawn = "DEATH and PLUGIN; there is no bed, anchor or End respawn"
PlayerDeath = "also reaches EntityDeath handlers; the new level fields wait for the respawn"
PlayerInput = "compared with the last input when the packet reaches the head of the lane"
PlayerToggleSneak = "after PlayerInput of the same packet, compared at the head of the lane"
PlayerToggleSprint = "on every start and stop sprinting packet of a loaded client"
PlayerToggleFlight = "only for a player who may fly and changes flight; a cancel resends the abilities"
PlayerGameModeChange = "from /gamemode, the game mode packet, plugin orders and the hardcore respawn; the mode is read at the head of the lane"
PlayerHideEntity = "players only, after the effect of the first plugin hiding them"
PlayerShowEntity = "players only, after the effect of the last plugin showing them"
PlayerItemHeld = "the previous slot is read at the head of the lane; a cancel sends it back"
PlayerAnimation = "ARM_SWING from the punch packet only"
PlayerSwapHandItems = "the items are those after the swap; an outdated swap is refused and resynced"
PlayerInteract = "LEFT_CLICK_AIR, LEFT_CLICK_BLOCK, RIGHT_CLICK_AIR and RIGHT_CLICK_BLOCK; the three sites where Spigot ignores the result ask the deciding handlers and drop their verdicts; PHYSICAL is asked for each player standing on a pressure plate that is not pressed (the first one that is not denied presses it, every player for a weighted plate) and for the players on a tripwire that is attached when it would trip, with the plate or wire as clicked block, the face SELF and no item; a cancel or a denied block result keeps that player from counting"
PlayerInteractAtEntity = "one fire per entity click, settled once for both handler types"
PlayerInteractEntity = "reached through PlayerInteractAtEntity, as Spigot never builds it alone"
PlayerDropItem = "carries the dropped stack, which a deciding handler may replace; the item entity spawns once settled"
PlayerItemDamage = "fires with 0 for creative players and unbreakable items; every wear is a distinct event, read when it reaches the head of the lane"
PlayerTakeLecternBook = "the book stays on the lectern until the event settles"
PlayerItemBreak = "after the PlayerItemDamage of the same wear"
PlayerExpCooldownChange = "PICKUP_ORB only, as no plugin order sets the cooldown; a negative cooldown blocks the pickup for good, as in Spigot"
PlayerExpChange = "orb pickups only; the amount is the orb value since there is no Mending yet"
PlayerLevelChange = "compared once per tick at the experience sync, from any cause, never at respawn"
PlayerPickupArrow = "arrows that allow pickup only; not asked again for an arrow while a deciding handler answers for it; carries the stack the arrow gives, read-only"
PlayerShearEntity = "sheep only; saddles are sheared without the event, as in Spigot"
BlockDamage = "once per survival dig start; insta_break comes from the mining speed, and a cancel leaves no mining session so the finish is refused"
BlockDamageAbort = "on every release in reach, and out of reach while a mining session runs"
BlockBreak = "creative starts, insta mines and finished survival digs; a finish below 0.7 progress breaks later, once the progress reaches 1; exp_to_drop starts at 0 since no block gives experience yet; a creative tool that cannot break blocks makes it born cancelled"
BlockDropItem = "after every break that keeps its drops, also when empty; each item carries the handle of the item entity it will spawn and its stack, which a deciding handler may replace while keeping a subset; velocity and pickup delay are not exposed"
BlockCanBuild = "for every block item placement that has a state to place; buildable starts as the player obstruction test, mobs are not checked"
BlockPlace = "every item use that changes one block: block items, hoes, axes and shovels; asked before the world changes, so it carries the placed state"
BlockMultiPlace = "doors and tall plants, in Spigot capture order with the upper half first; hand is always HAND"
BlockPhysics = "the notifyAndUpdatePhysics site only, once per block change; a cancel keeps the neighbour shape updates; source_block is the block itself, as in Spigot"
BlockCook = "campfires; a cancel keeps the food and the campfire asks again on its next tick, one ask per campfire at a time"
CampfireStart = "when food goes on a campfire; the recipe is its key and the patched cook time is written without a check, as in Spigot"
BlockExplode = "explosions without a source entity or a causing entity, today the plugin explosion order; the block list patch removes and adds blocks to destroy"
BlockExp = "the experience a furnace kept when its block entity goes and a furnace output taken by number key, one event per recipe used, also for 0"
ChunkLoad = "once a loaded chunk is accepted, at the next tick; the spawn chunks load at startup and reach the plugins already connected"
ChunkPopulate = "right after ChunkLoad for a chunk generated by the load, as Spigot runs no populator of its own"
ChunkUnload = "when a chunk without tickets reaches its unload delay; save_chunk false drops its changes, and a chunk that got a ticket back while asked stays loaded and is not notified"
EntitiesLoad = "after the entities of a loaded chunk are added, also when there is none"
EntitiesUnload = "before the entities of an unloading chunk are saved and removed, never for an autosave"
TNTPrime = "a TNT block about to become a primed TNT: a redstone signal (REDSTONE, with the block that changed as priming block), a player lighting it with flint and steel or a fire charge (PLAYER, with the player), a fire burning it (FIRE, with the fire), another explosion destroying it (EXPLOSION, with the exploding entity), and a dispenser holding flint and steel (DISPENSER, with the dispenser); a cancel keeps the TNT block, and the item of the player unused; a burning arrow (PROJECTILE) and a player breaking an unstable block (BLOCK_BREAK) are not produced yet"
TimeSkip = "COMMAND for /time add and CUSTOM for the plugin time order; with a deciding handler the time moves once the event settles, by the settled amount, and a cancel keeps it, a documented deviation from Spigot 26.3 which moves it before firing; /time set fires nothing"
WorldInit = "when the server starts its world, before the spawn chunks; the plugin port is already open, so it reaches the plugins connected by then; also for each other dimension (nether, end) when it is first created, with the world field set to that dimension"
WorldLoad = "once the spawn chunks are ready, for the plugins connected by then; for a dimension created later (nether, end) right after its world init, while its spawn chunks are still loading, with the world field set to that dimension"
WorldSave = "before /save-all, the plugin save orders and the autosave write, and at shutdown before the final save while plugins are still connected"
SpawnChange = "from /setworldspawn and the plugin spawn order, after the change and only when the spawn moves"
WeatherChange = "from /weather and the plugin weather order when the rain flag changes, before ThunderChange; a cancel keeps the sky and sends nothing, as there is no natural weather cycle or timer"
ThunderChange = "from /weather and the plugin weather order when the thunder flag changes, after WeatherChange settled, each cancellable on its own"
CreatureSpawn = "every creature added to the world: NATURAL, COMMAND, CUSTOM, SPAWNER_EGG, BREEDING, REINFORCEMENTS, DROWNED and FROZEN; a waiting natural spawn holds its slot and a cancel frees it; a plugin spawn question is answered once its spawn settles, refused when cancelled; chunk-loaded entities and players fire nothing"
EntitySpawn = "experience orbs and falling blocks, the entities that are neither creatures, items nor projectiles; its handlers also hear CreatureSpawn, ItemSpawn and ProjectileLaunch"
ItemSpawn = "every item entity added to the world; a cancel discards it without EntityRemove; a plugin drop question is answered once its spawn settles, refused when cancelled"
ProjectileLaunch = "arrows shot by players and skeletons; a cancel discards the arrow"
EntityRemove = "every removal of an entity in the world, before it leaves, with DEATH, DESPAWN, DROP, EXPLODE, HIT, MERGE, OUT_OF_WORLD, PICKUP, PLUGIN, TRANSFORMATION or UNLOAD; fires once per entity, since a removed entity leaves the store and cannot be removed again; never for players or a cancelled spawn"
EntityDropItem = "chicken eggs, sheared wool and saddles, the item of a stopped arrow and of a falling block that cannot land; a cancel keeps the rest of the action"
EntityDamage = "every hurt of a player, a mob or an item entity, asked before the invulnerability window and with a damage of 0; set_damage reruns the armor, resistance and absorption chain; FREEZING, BLOCKING and MAGIC do not exist; a cancel leaves the hit without effect and the attacker hears NODAMAGE"
EntityDamageByEntity = "player and mob melee, sweeps, arrows (the damager is the arrow), creeper explosions and falling blocks; ENTITY_SWEEP_ATTACK never comes out, as in Spigot 26.3"
EntityDamageByBlock = "lava with its block, the void with no block and stalagmites with their tip; a plugin explosion without a source is BLOCK_EXPLOSION with no block; lava and void are asked once per victim while one waits"
EntityDeath = "mob deaths, also when the loot is empty; asked on a snapshot of the loot, the equipment drops and the experience while the mob lies dying, the death applies when the event settles: the settled drops spawn as items, each firing ItemSpawn, then the orbs fire EntitySpawn; PlayerDeath also reaches its handlers"
EntityRegainHealth = "players only: SATIATED from food, REGEN in peaceful, MAGIC from instant health and MAGIC_REGEN from regeneration; mobs never heal yet; a cancelled satiated heal still costs its exhaustion, as in Spigot"
EntityExhaustion = "players who are not invulnerable: DAMAGED, UNKNOWN for an attack, HUNGER_EFFECT, REGEN and BLOCK_MINED; there is no movement or jump exhaustion yet; every exhaustion is asked in turn"
FoodLevelChange = "hunger from exhaustion and the saturation effect; eating and cakes do not exist yet; a cancel keeps the food and resends the health packet"
EntityCombust = "undead burning in daylight; its handlers also hear EntityCombustByBlock and EntityCombustByEntity; a combustion is asked once per entity while one waits"
EntityCombustByBlock = "fire blocks once the fire counter reaches 0 and lava for a living entity that is not burning, with the lava block it touched; burning or non-living entities catch fire from lava without the event, as in Spigot"
EntityCombustByEntity = "a burning arrow before its hit; the combuster is the arrow"
EntityPotionEffect = "COMMAND, PLUGIN, EXPIRATION (also when an effect stops ticking) and DEATH at respawn, for players and mobs; restored effects fire nothing; a cancelled expiration keeps the spent effect and asks again each tick"
EntityKnockback = "the hurt knockback (ENTITY_ATTACK with a direct entity, DAMAGE otherwise, which no damage type of rspigot without a direct entity produces yet), the extra knockback of player and mob attacks (ENTITY_ATTACK), sweeps (SWEEP_ATTACK) and explosions (EXPLOSION); a player hit fires two, a swept target two; the settled final knockback is the new velocity; there is no shield, goat or mace knockback"
EntityKnockbackByEntity = "every knockback whose source is an entity: the direct entity of the hurt, the attacker or the explosion source; reaches EntityKnockback handlers"
ItemDespawn = "an item entity that reaches item-despawn-rate while it ticks; one ask per item while it waits, a cancel resets its age; items do not age while inactive, unlike Spigot"
EntityPickupItem = "players touching an item they can hold, with what does not fit as remaining; one ask per player and item while it waits; mobs never pick up items yet"
EntityChangeBlock = "a falling block leaving its place (before the block turns to air and the entity spawns) and landing (a cancel removes it without placing or dropping), and a grazing sheep (to air also for grass that turns to dirt); without mobGriefing the grazing is born cancelled and asks nobody"
EntityInteract = "a zombie breaking a turtle egg, before the egg goes, and an entity that is not a player standing on a pressure plate that is not pressed or on an attached tripwire, with the plate or wire as block; a cancel keeps that entity from counting; there is no farmland trampling yet"
CubeMobSplit = "a slime or magma cube of size 2 or more at the end of its death, with the number of children it will split into; a cancel or a count of 0 splits nothing and the cube still goes away; SlimeSplitEvent is its obsolete Bukkit alias"
EntityTransform = "a mob converting into another (SPLIT for the children of a dying cube, listed together, DROWNED, FROZEN, INFECTION, CURED, PIGLIN_ZOMBIFIED and METAMORPHOSIS otherwise); a cancel keeps the old mob, or for a split keeps the children away"
SheepRegrowWool = "after the grazing of a sheep settled, also when it was cancelled; a cancel keeps the sheep sheared"
EntityTeleport = "/tp of a non-player entity asks twice, the command then Entity.teleport, and only the second destination counts, as in Spigot; the first one carries the absolute destination, where Spigot sends the difference on the relative axes, a bug not copied; the plugin teleport order asks once; there are no portals, pearls, endermen or shulkers yet"
ExplosionPrime = "creepers once their fuse ends, one ask per creeper while it waits; a cancel resets the fuse and the creeper lives; the settled radius and fire are the explosion's, a fire flag now sets fire to the crater"
EntityExplode = "explosions with a source or causing entity, after the entities were hurt and pushed; a cancel breaks and sends nothing but keeps the hurts, the push and the fire; the creeper leaves with EXPLODE once it settled"
ProjectileHit = "arrows of players and skeletons: an entity hit is asked and the arrow waits in place, a cancel lets it fly on without damage; a block hit asks its deciders without waiting and drops their verdicts, since its cancel would only skip block reactions that do not exist yet; ExpBottle, PotionSplash and LingeringPotionSplash never reach its handlers"
EntityShootBow = "the drawn bow of a player, whose arrow is spent before the event as in Spigot, and skeletons; a cancel discards the arrow, the player still hears the shot, the skeleton does not; set_projectile to another entity launches nothing; there is no crossbow, Infinity or bow wear"
EntityTarget = "reached through EntityTargetLivingEntity, as Spigot builds the exact class only for the allay, which rspigot lacks"
EntityTargetLivingEntity = "CLOSEST_PLAYER, CLOSEST_ENTITY, FORGOT_TARGET, TARGET_DIED, TARGET_ATTACKED_ENTITY, TARGET_ATTACKED_NEARBY_ENTITY, REINFORCEMENT_TARGET and TEMPT from the AI goals, alerts, reinforcements and experience orbs, only when the target changes; with a deciding handler the change lands one AI pass later, one ask per mob while it waits; the settled target is not revalidated, as in Spigot"
EntityBreed = "cows, pigs, sheep and chickens breeding through their goal, one ask per couple while it waits; the breeder is the online player who fed the mother, then the father; bred_with is the stack in the selected slot once the food is spent, as Animal.setInLove reads it, not saved; a cancel leaves both parents in love"
EntityEnterLoveMode = "feeding an adult cow, pig, sheep or chicken; the food is spent before the event as in Spigot, the settled ticks are written as they are"
SheepDyeWool = "a dye used on a sheep of another colour; the sheep, its colour and the dye change once settled, a cancel resends the hands"
EntityPoseChange = "observer only, once per tick from the pose of each living entity and player that changed since the last tick: DYING of mobs, STANDING and SNEAKING of players (sneaking only when not flying, now also in the pose sent to clients); there is no sleeping, swimming, gliding or mob-specific pose yet"
ServerListPing = "a network hook outside the tick: when no plugin listens the ping answers at once from the configuration, an observed ping answers at once, and a deciding handler makes the answer wait for the settlement within decision-ticks; hidden_players leave the sample and the count, server_icon must be a 64x64 PNG; the answer is capped at 32767 characters by dropping the icon, then cutting the MOTD, and a patched MOTD or icon too long for it is refused; a legacy ping has an empty hostname and no players and ignores the icon and the hidden players; the MOTD goes out as plain text, its section codes are not converted"
ServerLoad = "STARTUP once, when the server starts running, for the plugins connected by then; RELOAD is never fired since there is no reload"
PluginEnable = "when a plugin connects, for the other plugins and never for the plugin itself; a plugin never hears the activations made before it connected; a plugin reconnecting under its name fires PluginDisable for its old connection first"
PluginDisable = "when a plugin disconnects, for the plugins left; at shutdown for every plugin in reverse connection order before the connections close, and every plugin hears the disable of every other one, unlike Spigot which unregisters a disabled plugin's listeners; never for the plugin itself"
ServerCommand = "console lines only, run in the order they were typed; not for dispatched commands, player commands or Ctrl+C; a cancel drops the line silently, and a line that settles after stop does not run"
TabComplete = "players only, for every command and its player name arguments, a superset of Spigot which fires it for Bukkit commands only; an empty or cancelled completion sends no packet, as Spigot; there is no console completion"
BroadcastMessage = "the plugin broadcast order, never /say or /me; the recipients are the console then every player; a broadcast ordered while a handler of a BroadcastMessage runs, deciding or observing, goes out without firing again, and every other one waits behind the broadcasts already asked"
AreaEffectCloudApply = "every 5 ticks once a cloud has left its wait time and has effects, with the living entities in its radius that are not on its reapplication delay; one ask per cloud while it waits; a cancel applies nothing and the cloud asks again on its next beat"
BlockGrow = "a bone meal on a crop and a turtle egg growing a stage on its random tick; the new state is applied once settled, a cancel keeps the block"
BlockIgnite = "a fireball hitting an air block, with FIREBALL and the fireball as igniting entity, an end crystal kindling the fire under it, with ENDER_CRYSTAL, and a burning fire spreading to an air block next to it, with SPREAD and the fire as igniting block; fire is placed once settled and only if the block is still air; a cancelled spread skips BlockSpread; no other ignition source exists yet"
BlockReceiveGame = "observer only, once per vibration that a sculk sensor, a warden or an allay listener validates for itself, with the game event name and its entity; a vibration the listener cannot receive is still reported, born cancelled"
BlockRedstone = "a wire taking a new power from its neighbours, a redstone torch turning off or back on, a lamp lighting or going dark, a lever pulled or a button pressed by hand (asked before the block changes), a button released or pressed by an arrow, a pressure plate gaining or losing its signal, a repeater, a comparator or an observer turning on or off, a door, a trapdoor or a fence gate whose power changes, a detector rail gaining or losing its minecart, a daylight detector taking a new power from the sky (every 20 ticks or when inverted by hand), a lightning rod struck by a bolt, and a tripwire hook recomputing its line (always asked with 15 to 0, as Spigot does, and any patched value above 0 stops the update); old and new current are 0 or 15 except for wires and weighted plates; a patched new current decides the power a wire, plate or daylight detector takes, and any value other than the one the block needs to change cancels the change in the lever, button, torch, lamp, repeater, comparator, observer, detector rail, door, trapdoor and fence gate"
BlockPistonExtend = "a powered piston whose block line resolves (at most 12 pushed blocks, plus the blocks it breaks, listed pushed first), asked before anything moves; direction is the piston facing; a cancel keeps the piston retracted and the blocks where they are, and resends the listed blocks and the cells they would move into to the players who see them"
BlockPistonRetract = "an unpowered plain piston, with no blocks, asked before it pulls its head back, direction being the piston facing; a sticky piston pulling the block in front of its head, with that block listed, asked after its head is removed, direction being the way the block moves (the opposite of the piston facing); a sticky piston with nothing to pull retracts without the event; a cancel keeps the plain piston out and lets the sticky piston leave its block in place, resending the listed blocks to the players who see them"
EntityBlockForm = "a snow golem laying a snow layer in its trail, asked before the block is set; a cancel keeps the block"
EntityDismount = "a rider leaving its vehicle, by itself, forced or through VehicleExit; for a vehicle that is a Bukkit vehicle with a living rider it comes after the settled VehicleExit; a cancel keeps the rider, and a forced exit (remount, removal) is only announced"
EntityMount = "a mount being attached; for a Bukkit vehicle with a living rider it comes after the settled VehicleEnter; a cancel keeps the rider off"
VehicleEnter = "a living entity boarding a horse, boat, minecart, pig, strider or happy ghast, before EntityMount; a cancel stops the boarding"
VehicleExit = "a living rider leaving a Bukkit vehicle on its own, before EntityDismount; a cancel keeps the rider seated; a forced exit (remount, vehicle removed) only announces it, whatever the answer"
VehicleMove = "observer only, on each vehicle move packet of its rider that changes the position or the rotation, after the vehicle has moved, and once per tick for a boat or minecart the server moves itself when its position or rotation changed during the tick"
VehicleCreate = "a boat or a minecart added to the world: a boat or minecart item placed by a player or a vehicle summoned; asked before it is added, with the vehicle, and it replaces EntitySpawn for these entities; a cancel adds nothing and keeps the placed item; a vehicle loaded back from a chunk fires nothing"
VehicleDamage = "a boat or minecart hit or otherwise hurt by a damage source that reaches it (a player, a projectile, an explosion), asked before the wobble and the damage are applied, with the entity to blame and the damage; the damage is patchable, the event stands in for EntityDamage which these vehicles never fire; a cancel changes nothing and the hit is not counted"
VehicleDestroy = "a boat or minecart about to be destroyed, asked right after its VehicleDamage settled: when the accumulated damage passes 40, or on any hit by a creative player; a cancel keeps the vehicle and resets its damage to 40, and an allowed event removes the vehicle, with its item and chest contents dropped unless a creative player broke it"
VehicleBlockCollision = "observer only, a boat or minecart the server moves (never a vehicle driven by a player's own client) whose move was blocked horizontally by a block that is not air, with the block on the side it was pushing towards; a collision stopped by nothing solid fires nothing"
VehicleEntityCollision = "a boat touching a pushable entity above its floor or another boat, or a minecart touching a minecart, a player or a mob, one ask per pair and tick, before the push or the boarding; a cancel stops the push and the boarding; the fields collisionCancelled and pickupCancelled are not read by the server"
VehicleUpdate = "observer only, once per tick for each boat or minecart the server ticks, after it moved; a vehicle in a chunk that does not tick fires nothing"
EntityEnterBlock = "a bee entering a beehive that has room, one ask per bee while it waits; a refusal keeps the bee out for a while"
EntityPlace = "an end crystal placed by a player on obsidian or bedrock, an armor stand placed on a free spot, a boat or raft (chest versions included) placed on the water or a block it hits, or a minecart placed on a rail, asked before the entity spawns and the item is spent; a cancel keeps the item and spawns nothing"
HangingPlace = "an item frame, glow item frame or painting placed by a player on the face of a block that holds it, asked once the support, the room and (for a painting) a variant that fits are checked and before the entity spawns and the item is spent, with the clicked block, its face, the hand and the item; a cancel keeps the item and spawns nothing"
HangingBreak = "a hanging entity (item frame, glow item frame, painting) removed without an entity to blame: its support gone or something in its way after the periodic check every 100 ticks (cause PHYSICS when its block is empty, OBSTRUCTION otherwise), or an explosion (EXPLOSION) or other damage (DEFAULT); a cancel keeps the entity; a framed item popped out by a hit does not fire it; also notified for HangingBreakByEntity"
HangingBreakByEntity = "a hanging entity broken by damage from an entity (cause ENTITY, or EXPLOSION for a blast), with that entity as the remover, a player hitting it included (a hit deals no damage but breaks an empty frame or a painting); a cancel keeps the entity"
PlayerArmorStandManipulate = "a player right clicking an armor stand to put on, swap or take a piece, asked before the change with the stand item and the player item (air when empty), the slot (the clicked piece for an empty hand, the one the item goes to otherwise) and the hand; a slot disabled by the stand or locked by its DisabledSlots fires nothing; a cancel changes nothing"
EntityPortal = "the plugin order that changes the dimension of a non-player entity and an entity reaching an End portal, never for the ender dragon; the destination can be patched, set to null to refuse, and nothing creates a portal; a cancel keeps the entity where it is"
PlayerPortal = "every dimension change of a player, with its cause (NETHER_PORTAL, END_PORTAL...), asked before the player leaves; the destination can be patched, and a cancel keeps the player home"
PlayerChangedWorld = "after the player has arrived in the new dimension and its chunks started to stream, with the world it left"
EntitySpellCast = "an illager spellcaster finishing the warm-up of a spell, before the spell takes effect; a cancel casts nothing"
EntityTame = "a player taming a wolf, cat, ocelot, nautilus or horse by the vanilla ways, asked before the owner is set; a cancel keeps it wild"
EntityTargetBlock = "a copper golem choosing a chest to carry its item to, before it walks there; a cancel or a null target drops the target, a patch retargets it"
EntityUnleash = "observer only, before a lead is dropped: HOLDER_GONE, DISTANCE, UNKNOWN for a sulfur cube; PLAYER_UNLEASH, SHEAR and FIREWORK are never produced"
HorseJump = "a rider charging a jump on a horse or a camel with a power above 0, before the jump starts; a camel that cannot jump asks nothing; a cancel gives no jump, no stand and no sound"
PigZombieAnger = "a zombified piglin starting its persistent anger timer, with the sampled anger, a cancel gives none"
PiglinBarter = "an adult piglin finishing its barter with a gold ingot, with the loot already drawn; the outcome is only described when someone listens; a cancel throws no item"
PlayerBucketEmpty = "a player emptying a mob bucket, a water bucket or a lava bucket on a block, asked before the block or the fish is placed, with the block the liquid would go to (the clicked block itself for a water bucket on a waterloggable block); the bucket is the one held, and item_stack is the one held for a mob bucket and the empty bucket left behind for a water or lava bucket; a patched item_stack is not read back; a cancel keeps the bucket and the world; a water bucket in the Nether still fires it, then evaporates; a powder snow bucket placing its block fires BlockPlace only"
PlayerBucketEntity = "a player catching a fish, an axolotl or a sulfur cube with a bucket, asked before the mob is removed and the bucket replaced; a cancel keeps both"
PotionSplash = "a thrown potion hitting a block or an entity, with the entities it reaches and their intensity; a patch sets the intensities, a cancel applies no effect but the splash still shows and the potion still breaks"
RaidFinish = "observer only, when a raid is won, with the winning players"
RaidSpawnWave = "observer only, once a wave of a raid has spawned, with its raiders and the patrol leader"
RaidStop = "observer only, when a raid ends without a victory: PEACE, TIMEOUT, FINISHED, UNSPAWNABLE, NOT_IN_VILLAGE or PLUGIN"
RaidTrigger = "a player whose Raid Omen effect ends in a village, asked before the raid is created or extended; a cancel starts nothing and removes the Raid Omen effect"
TradeSelect = "a player picking an offer in a villager or wandering trader menu, asked before the selection applies; a cancel resyncs the open menu"
VillagerAcquireTrade = "a merchant gaining a new offer, from a villager level-up or the generation of a trade set that forbids duplicates; the recipe can be replaced and a cancel adds nothing"
VillagerReplenishTrade = "each offer of a villager when its uses are reset by a restock; a cancel puts the old uses back"
EnderDragonChangePhase = "every phase change of an ender dragon, before it applies, with the current and the new phase; the new phase can be patched and a cancel keeps the dragon in its phase"
StriderTemperatureChange = "a strider whose shivering differs from the warmth under it (lava, a warm block or a warm strider carrying it), asked once per tick while it waits; a cancel keeps the old state and asks again"
ArrowBodyCountChange = "an arrow sticking in a mob or a player (one more, reset is false) and the slow shedding of one arrow at a time, asked with the old and the new count; the change is applied once settled, relative to the count at that moment, and a patched new_amount is set as is; a cancel keeps the count"
BatToggleSleep = "a resting bat waking because it has no solid block above or a player came close (awake is true), and a flying bat settling on a ceiling (awake is false), one ask per bat while it waits; a hurt bat wakes without the event, as in Spigot; a cancel keeps the bat as it was"
BlockFromTo = "a fluid spreading to a neighbour, one ask per target with the flowing block, the face and the target, before the target changes: down first, then each side; a cancel of the downward flow also skips the leak to the sides, as in Spigot; lava reacting with water asks nothing"
EntityAirChange = "the air of a mob changing in its tick (breathing in or out, drying out, drowning), one ask per tick with the final amount, not one per intermediate write; a cancel keeps the old air and the drowning damage of that tick, a patched amount is set as is and replaces the drowning; players have no air supply yet"
EntityPortalEnter = "observer only, every tick that an entity or a player that can use the End portal touches an end portal block, once per portal block, before the cooldown is looked at; the location is the portal block; the ender dragon, the wither, end crystals, riders and the dead ask nothing"
EntityToggleSwim = "a drowned starting or stopping to swim, asked before the swimming flag changes, one ask per drowned while it waits; a cancel keeps the flag; players, dolphins and other mobs have no swimming state yet"
FluidLevelChange = "a flowing fluid block changing its level or drying up in its scheduled tick, asked before the block is set, with the new block state (air when it dries); a patch replaces the state, a cancel keeps the block and skips its spread"
GenericGame = "every game event the server posts (steps, block changes, eating, shrieks and the others), asked before the listeners are searched, with the event name, the block position, the source entity and the notification radius; a patched radius widens or narrows the sections searched and a cancel reaches no listener"
PlayerItemConsume = "a player finishing eating a food or an ominous bottle, asked before the item is spent; a patched item is the one eaten and the hand takes what is left of it, as in Spigot; a cancel keeps the item and the food bar and stops the use; drinks, milk and honey do not exist yet"
PortalCreate = "the obsidian platform of the End, asked before it is placed when a player or an entity arrives through an End portal, with the blocks it will change (END_PLATFORM); a cancel places nothing and the traveller still arrives; no Nether portal is created yet"
VillagerCareerChange = "a villager taking the profession of the job site it reached (EMPLOYED) or losing the one of an unemployed novice (LOSING_JOB, with none), asked before the profession is set, one ask per villager while it waits; a patched profession replaces it and a cancel keeps the villager as it is"
VillagerReputationChange = "a villager's gossip about a player changing by a trade, a hurt, a kill or a cure, one ask per gossip type with the old, new and maximum value and the reason; a patched new_value is stored clamped to the maximum and a cancel keeps the old value"
PlayerResourcePackStatus = "observer only, every resource pack answer a client sends in play (accepted, declined, downloaded, loaded, failed and the others), with the pack id and the status; the server pushes no pack by itself and, as in Spigot, a required pack that is declined is not enforced"
PlayerCustomClick = "observer only, every custom click action a client sends in play (a dialog button or a text click event of kind custom), with the namespaced id and the payload as JSON, null when there is none"
PlayerSignOpen = "a player right-clicking an unwaxed sign (cause INTERACT, the side facing the player) or placing a sign item (cause PLACE, front), asked before the editor is sent, with the sign text; a cancel opens no editor; players who cannot build and another player editing the same sign ask nothing; dyes, glow ink, honeycomb and click commands do not exist yet"
SignChange = "a player finishing a sign edit, asked with the four typed lines (control characters removed) and the side, only when that player was sent the editor of that sign; a patched line replaces the typed one and a cancel keeps the old text; the editor right is spent either way"
PlayerEditBook = "a player saving or signing a writable book from a hotbar or offhand slot, asked before the book changes, with the old meta, the new meta (pages, and for a signature the title and the player name as author) and the signing flag; a patched meta and signing flag replace them, a signature turns the item into a written book and a cancel keeps the book and resends the inventory; the 20 tick edit rate limit is not enforced"
PlayerRecipeBookSettingsChange = "observer only, a client changing the open or the filtering state of one of its four recipe books (crafting, furnace, blast furnace, smoker), with the book and the new state, before it is stored; the state is kept per player, saved under recipeBook in the player data and sent to the client at login"
PlayerLeashEntity = "a player right-clicking a mob with a lead (not a hostile mob, within the snap distance, not already held by a player), asked before the mob is tied to the player and the lead consumed; a cancel keeps the lead and resends the item and the link; the lead on a fence knot, the lead on the nearby mobs a sneaking player is holding and shears do not exist yet"
PlayerUnleashEntity = "a player right-clicking a mob it holds on a lead, reaching EntityUnleash handlers too with reason PLAYER_UNLEASH, asked before the lead is dropped as an item (or removed in creative); a cancel resends the link; the lead snapping, a dead holder and a plugin unleash fire EntityUnleash only"
LightningStrike = "a lightning bolt entering the world through /summon (cause COMMAND), a plugin spawn (CUSTOM) or any other spawn reason (UNKNOWN), asked before the bolt is added; a cancel adds none; the thunderstorm strikes (WEATHER), the lightning rod and trident or channeling strikes do not exist yet, and the bolt does not ignite rods, wax copper or trigger advancements"
CreeperPower = "a creeper inside the 3 block radius of a bolt (cause LIGHTNING), asked after the bolt burned and hurt it and before it is charged; a cancel keeps it uncharged; a plugin charge (SET_ON, SET_OFF) does not exist"
PigZap = "a pig inside the 3 block radius of a bolt on a difficulty above peaceful, asked with the zombified piglin that would replace it (golden weapon, persistent, same AI flag) instead of EntityTransform; a cancel keeps the pig and the bolt does not hurt it"
EntityResurrect = "any lethal damage that does not bypass invulnerability, to a player or a mob, asked before the death; with a totem of undying in the main or the off hand the hand is set and a cancel lets the entity die; without one it is seen cancelled by observers only (no decision, no way to resurrect without a totem), as Spigot starts it cancelled; allowed, the totem loses one item, health becomes 1, the effects are cleared then regeneration, fire resistance and absorption are applied (cause TOTEM) and status 35 is sent; statistics and the totem trigger do not exist yet"
PlayerHarvestBlock = "a player right-clicking a sweet berry bush of age 2 or 3 (age 2 only without bone meal in hand) or a cave vine holding glow berries, asked before the berries drop, always with the main hand and the harvest loot table; a cave vine first asks EntityChangeBlock for the player; a cancel keeps the berries on the plant; a patched list replaces the dropped items; the bush returns to age 1 and the vine loses its berries"
ItemMerge = "two item entities of the same stack type within 0.5 blocks horizontally and 0 vertically on the ground, asked once per candidate before the merge, the event entity being the one absorbed and the target the one that grows; a cancel keeps both; allowed, the absorbed entity is removed (cause DESPAWN) and the target takes as many items as fit, up to the maximum stack size"
ExpBottle = "a thrown experience bottle hitting a block or an entity, asked with the experience 3 plus two rolls of 0 to 4 and the show-effect flag set; a patch changes either, an amount of 0 or less drops nothing, a cancel is ignored as in Spigot; the bottle is always removed, the effect plays the splash event with the water colour and the orbs appear at the bottle"
LingeringPotionSplash = "a thrown lingering potion with effects hitting a block or an entity, asked with the area effect cloud it would leave (radius 3, 600 ticks, 10 wait, shrinking), before the cloud is added; a cancel adds no cloud; the splash event and the removal of the potion happen either way; a potion without effects leaves no cloud and asks nothing"
PlayerEggThrow = "a thrown egg owned by a player hitting something, asked with the chicken hatch decided by an eight in one roll and four babies on a thirty-two in one roll; a patch sets hatching, the entity type to hatch and the count; each baby is a chicken with the spawn reason EGG; an egg of another owner hatches by the default roll without an event"
PlayerBedEnter = "a right click on a bed half, asked after the checks of the rule (dimension and time), the distance (3 blocks horizontally, 2 vertically), the room above and the hostile mobs within 8 by 5 blocks, with the result of those checks as the bed enter result (OK, NOT_POSSIBLE_NOW, NOT_POSSIBLE_HERE, TOO_FAR_AWAY, NOT_SAFE or OTHER_PROBLEM); it is not fired for a player who is dead or already asleep; the bed is the head half whichever half was clicked; ALLOW lets the player sleep whatever the checks said, DENY or a cancel keeps the player out with no message, DEFAULT keeps the checks (their message is shown over the hotbar, and a bed of the Nether or the End explodes); sleeping teleports the player onto the bed (cause UNKNOWN) and fires PlayerSpawnChange before this event"
PlayerBedLeave = "a sleeping player leaving the bed: the leave bed packet, the morning, a hurt, the bed being broken, the rule no longer allowing sleep or the night skip, asked before the player gets up; the bed is the head half the player slept in and set_spawn_location is always true and never read back, since Spigot sets the spawn when the player enters the bed; a cancel keeps the player in bed; allowed, the bed frees, the player stands beside it facing it (cause EXIT_BED); a quit does not fire it"
PlayerSpawnChange = "a bed set as the spawn (cause BED, on the first click of a valid bed whether the player sleeps or not, with the message shown when the position changes) and a missing bed at respawn (cause RESET with no new spawn); the new spawn is the block position of the bed with the yaw and the pitch of the player, and forced is false; a patched new spawn or forced replaces them and a cancel keeps the old spawn; the respawn anchor, /spawnpoint and plugin spawn points do not exist yet, so the causes RESPAWN_ANCHOR, COMMAND, PLUGIN and UNKNOWN are never used"
PlayerBucketFill = "a player using an empty bucket on a water or lava source, a powder snow block, a bubble column or a waterlogged block, found by a ray that stops on fluid sources, asked before the world changes; block and block_clicked are the same block, the bucket is the empty bucket and item_stack the full bucket that would be handed over; a patched item_stack replaces it (an empty one hands over nothing); a cancel keeps the block and the bucket; allowed, the source becomes air (or the waterlogged flag clears), and a creative player keeps the empty bucket and only gains the full one if none is held; a cauldron is filled through CauldronLevelChange instead"
SpongeAbsorb = "a dry sponge placed or touched by a neighbour change, one tick later, reaching water by a breadth first search through water cells (6 blocks deep, 65 cells including the sponge): water blocks, bubble columns, kelp, seagrass and waterlogged blocks; asked with every block it would replace (the state each becomes: air, or the waterlogged block drained) in visit order, before anything changes; a cancel keeps the sponge dry and the water; allowed, the blocks change, kelp and seagrass drop their loot, and the sponge becomes a wet sponge; nothing is asked when no water is reached; the blocks are not read back; a wet sponge placed in the Nether dries into a sponge"
CauldronLevelChange = "a cauldron changing level, asked with the state it becomes and the entity at fault: a player filling it with a water, lava or powder snow bucket (BUCKET_EMPTY) or draining a full one (BUCKET_FILL), emptying a water bottle into it (BOTTLE_EMPTY) or taking a bottle out of a water one (BOTTLE_FILL), washing dye off leather armor (ARMOR_WASH), a layer off a banner (BANNER_WASH) or the color off a shulker box (SHULKER_WASH), a burning entity inside a water or powder snow cauldron putting itself out (EXTINGUISH, powder snow turns into water one level lower), and rain or snow topping up a water or powder snow cauldron by one level (NATURAL_FILL, no entity); a cancel keeps the cauldron and the item; the rain filling an empty cauldron fires nothing, as in Spigot; a stalactite dripping into a cauldron does not exist yet, and EVAPORATE and UNKNOWN are never produced; setNewLevel is not available"
BlockBurn = "a fire block, on its scheduled tick, burning a flammable neighbour (the flammability table of FireBlock, chance 300 on the sides and 250 above and below, 40 less in swamps and jungles); asked before the block is touched, with the fire as the igniting block; a cancel keeps the block; allowed, the block is replaced by a fire (a chance that falls as the fire ages, and not in the rain) or removed with no drops; a TNT block it burns is primed afterwards through TNTPrime"
BlockFade = "a block fading away, asked with the state it becomes; fire put out by rain, by missing support or by old age (becomes air); grass and mycelium under a block that stops them living, and farmland that dries out with no crop above (become dirt); a snow layer on its random tick under a block light above 11 (becomes air, drops its snow); ice on its random tick under a block light above 11 minus its dampening (becomes water, or air in the Nether); a cancel keeps the block"
BlockFertilize = "a player using bone meal on a crop, a sapling or a grass block, once the change is known: the list holds every block the bone meal would set (the grown crop, the next sapling stage, the tree, the new short and tall grass); asked after BlockGrow for a crop and after StructureGrow (with the same list) for a tree, and fired as already cancelled when that StructureGrow was cancelled; a cancel sets none of the blocks and the bone meal is still used up; the list is not read back, so a plugin cannot trim it; no event when the bone meal changes nothing, and moss, coral and flowers are not fertilised yet"
BlockForm = "snow settling on the ground or deepening one layer in the rain (up to the max_snow_accumulation_height rule, in cold biomes), a still water source freezing into ice at the edge of a pond in the cold, and a concrete powder block hardening when a liquid touches it after it was placed; asked with the state it becomes before it is set; a cancel keeps the block; concrete powder that lands as a falling block or is placed already beside water is not asked yet"
BlockSpread = "a spreading fire lighting an air block next to it, asked after BlockIgnite with the new fire as the new state and the burning fire as the source; a cancel keeps the air; the spread of grass, mycelium, vines, mushrooms and sculk does not fire it in the Spigot version served, or does not exist yet"
LeavesDecay = "a leaf block on its random tick, not persistent and at distance 7 from any log, asked before it is removed; a cancel keeps the leaves; allowed, it drops its loot and is removed; the distance is kept up to date by a tick one tick after a neighbour changes"
MoistureChange = "farmland on its random tick getting wetter (moisture 7, with water within four blocks on its level or one above, or rain on the block above) or drier by one, asked with the new state; a cancel keeps the moisture; farmland that is already at moisture 0 with no crop above becomes dirt through BlockFade instead"
StructureGrow = "a sapling growing into a tree, either on its random tick (a one in a hundred roll with a light of 9 above, stage 0 first moves to stage 1 with no event) or by bone meal (from_bonemeal true, with the player, after a 45 percent roll); asked with the dirt, logs and leaves it would set; a cancel sets nothing and, for bone meal, the BlockFertilize that follows is fired as cancelled; the blocks are not read back; only oak (TREE), birch (BIRCH) and spruce (REDWOOD) saplings grow, as small straight trees of the shape of the generated ones, and the other saplings, the big oak and the 2 by 2 trees are not grown yet"
PlayerStatisticIncrement = "any count of a discrete statistic (a jump, a block mined, an item crafted, used, broken, picked up or dropped, a kill, a death, damage dealt or taken, leaving the game) asked before the counter changes, with the statistic, the values before and after and, for the typed ones, the material or the entity type; a cancel leaves the counter as it is; the clocks and the distances (play time, sneak time, time since death or rest, every one-cm walk, swim, fly or ride) never fire it, as in Spigot; the counters are saved in stats/<uuid>.json and sent on a stats request; the interaction counters (open chest, ring bell, and the like) are not counted yet"
PlayerRecipeBookClick = "a client placing a recipe of its book (the PlaceRecipe packet) into the player grid, a crafting table grid or the input of the furnace, blast furnace or smoker it has open, asked after the recipe is checked as known and before any item moves; recipe is the id of the recipe and original_recipe the one the client asked for, a patched recipe is the one placed when it exists, and a patched shift_click is the maximum flag; the placement empties the grid into the inventory, then fills the cells with one craft, or as many as the items and the stack size allow with shift_click, and a recipe the inventory cannot make gets a ghost recipe sent back; stonecutter and smithing recipes are not in the book yet"
PlayerRecipeDiscover = "a recipe of the book (shaped and shapeless crafting, smelting, blasting and smoking) about to be awarded to a player who does not know it, one event per recipe, asked before it is added; a cancel keeps it out of the book; a granted recipe is sent with a toast and a highlight, saved in the player data under recipeBook and sent again at login; the recipes are awarded by the server only (nothing awards them yet, the advancements will), and transmute, special and campfire recipes are not in the book"
PlayerAdvancementCriterionGrant = "a criterion about to be granted to a player, asked before it is recorded, with the advancement key and the criterion name; a cancel records nothing; the criteria are granted by the supported triggers (the inventory changing, the recipe unlocking, a tick, eating or drinking an item, killing an entity of a given type, being killed by an entity, sleeping in a bed) and by the server; the other triggers (location, breeding, taming, placing blocks, brewing, trading, structures and the like) never fire, so their advancements stay open; the advancements come from the datapack, are saved in advancements/<uuid>.json and sent with the tab layout"
PlayerAdvancementDone = "observer only, an advancement whose requirements are all met for the first time, with its key, before its rewards (the recipes and the experience) are given and before it is announced in chat; the loot and function rewards do not exist"
PlayerFish = "a player casting a fishing rod (FISHING, with the hand, asked before the hook is thrown; a cancel throws none and keeps the rod), a hook whose bite delay ran out in water (BITE, asked before the splash and the dip; a cancel skips that bite), a bite nobody reeled in before its 20 to 40 ticks ended (FAILED_ATTEMPT, observer only), and a player using the rod again to reel in: a fish from the gameplay/fishing loot table with the open water treasure rule, Luck of the Sea and Lure read from the rod (CAUGHT_FISH, with the item entity as caught and an experience of 1 to 6 that a patch changes; a cancel stops the reel with the hook in place), the mob or item the hook is stuck in (CAUGHT_ENTITY, pulled towards the player), a hook lying on the ground (IN_GROUND) and a plain reel (REEL_IN); the rod loses 1 durability for a fish, 3 for an item, 5 for a mob and 2 on the ground; LURED does not exist in 26.3, the player luck attribute and the Luck effect are not added to the rod luck, and the item used statistic and the vibration are not recorded"
PlayerRiptide = "observer only, a player releasing a trident with Riptide after 10 ticks of use in water or rain, not riding, with the trident and the push velocity (1.5 plus 0.75 per level above the first, along the look direction), before the player is pushed; the trident loses 1 durability, a 20 tick spin attack hurts the first living entity touched for 8 and sends the player back at a fifth of its speed, and the ground lift of the launch is left to the client"
EntityToggleGlide = "a player starting to glide (gliding true: START_FALL_FLYING sent in the air, not in water, with an elytra in the chest slot that is not about to break, no Levitation and not riding), asked before the flag is set, and a gliding player who can no longer glide (landing, a broken elytra, Levitation, riding), asked once per tick while it waits; a cancel keeps the flag as it was and resends it; the elytra loses 1 durability every 20 ticks; players only, a mob never glides yet, and the wall impact damage of a glide is not applied"
FireworkExplode = "a firework rocket at the end of its flight (life above lifetime, 10 ticks per flight level plus a roll of 0 to 5 and 0 to 6), hitting a mob, a player or another entity it can hit, or hitting a block while it holds at least one explosion, asked before it bursts, asked again each tick while it keeps flying after a cancel; a rocket used on a block rises from the clicked point, one used by a gliding player is attached to the player and spent when launched; allowed, the burst hurts living entities within 5 blocks in line of sight for 5 plus 2 per explosion scaled by the distance, the attached player for the full amount, and removes the rocket (cause EXPLODE); the thrust on the elytra is left to the client, and dispensers do not launch rockets yet"
SpawnerSpawn = "a spawner block with a player alive and not spectating within its required range, once its delay ran out, for each mob it is about to place (up to its spawn count in a round), after the spawn spot, the collision, the spawn rules, the crowd limit and the mob checks passed and before the creature spawn; a cancel discards that mob, keeps the delay as it is and lets the round try the next one; the spawner field carries the block, the mob type it spawns and its delay"
LootGenerate = "a player opening a chest-like block (chest, trapped chest, barrel, shulker box, hopper, dispenser) or a chest or hopper minecart whose loot table is still pending, asked once the table is rolled and before the container is filled, with the holder, the opener as entity and looted entity, the rolled items, the loot table key and plugin false; the table is spent before the event, so a cancel leaves the container empty for good; a patch of loot replaces the items put in random free slots; only tables the server knows are rolled (blocks, entities and gameplay, not the structure chests) and a double chest unpacks each half in turn"
EntityBreakDoor = "a zombie (or other mob with the break-doors goal: drowned, husk, vindicator) that has stood at a closed door long enough to break it, asked before the door block is removed, with the door block, air as the new state and the mob; the handlers of EntityChangeBlock hear it too; a cancel keeps the door"

[states]
ready = []

[states.blocked]
AsyncStructureGenerate = "the Nether and End dimensions and structures (#23)"
AsyncStructureSpawn = "the Nether and End dimensions and structures (#23)"
BlockBrush = "its mechanic"
BlockDispenseLoot = "the vault and the trial chambers (keys, ominous vaults, loot rolls and the dispense state machine), the only source of this event"
EntityPortalExit = "a Spigot that fires it, which 26.3 never does"
MapInitialize = "maps"
PlayerLinksSend = "server links, which the server does not have (no configuration, no ServerLinks packet sent), and a Spigot that fires it during the configuration phase, before the player exists in the core"
RemoteServerCommand = "RCON (#28)"
SculkBloom = "the sculk catalyst and its spreader (cursors, charge decay, sculk growth), and the entity die game event, which living mobs do not fire yet"
TrialSpawnerSpawn = "the trial spawner block: no block entity, no state machine (inactive, waiting for players, active, ejecting rewards, cooldown), no per-player scaling of the mobs and no ominous variant"
VaultDisplayItem = "the vault block, which does not exist yet: no block entity, no key check, no loot table roll and no display item rotation"
WorldUnload = "dimension worlds, which stay loaded for the whole run once created: the server has no unload path for them and the overworld never unloads"

[events.PlayerMove]
unread = { setFrom = "Spigot never reads it back: a cancel always sends the player to where the move started" }

[events.EntityTeleport]
unread = { setFrom = "Spigot never reads it back: no caller reads getFrom() after the event" }

[events.EntityPortal]
unread = { setFrom = "Spigot never reads it back: the portal search reads getTo(), the radii and getCanCreatePortal() only" }

[events.PlayerPortal]
unread = { setFrom = "Spigot never reads it back: the portal search reads getTo(), the radii and getCanCreatePortal() only" }

[events.VehicleEntityCollision]
unread = { setCollisionCancelled = "Spigot never reads it back: boats and minecarts only look at the cancel", setPickupCancelled = "Spigot never reads it back: boats and minecarts only look at the cancel" }

[events.EntityPortalExit]
unread = { setFrom = "Spigot never reads it back: Spigot 26.3 never fires this event" }

[events.PlayerCommandPreprocess]
unread = { setPlayer = "Spigot reads it back only for commands sent through Player.chat, never for a command packet" }

[events.PlayerInteract]
getters = ["useInteractedBlock", "useItemInHand"]

[events.PlayerBedEnter]
getters = ["useBed"]

[events.PlayerBedLeave]
pairs = { setSpawnLocation = "shouldSetSpawnLocation" }

[events.ThunderChange]
getters = ["toThunderState"]

[events.WeatherChange]
getters = ["toWeatherState"]

[events.EnchantItem]
getters = ["whichButton"]

[events.ServerListPing]
getters = ["iterator"]
limits = { setMotd = 32767 }
rename = { iterator = "players" }
sets = ["hidden_players"]
extra = [
    { name = "hidden_players", java = "java.util.List<java.util.UUID>", patch = true, number = 100, reason = "Spigot reads back the players removed through iterator(): they leave the sample and the count" },
]

[events.PlayerDropItem]
omit = { getItemDrop = "the item entity does not exist until the drop applies; item carries its stack" }
extra = [
    { name = "item", java = "org.bukkit.inventory.ItemStack", patch = true, number = 100, reason = "Spigot reads getItemDrop().getItemStack() back after the event" },
]

[events.PlayerPickupArrow]
omit = { getItem = "the item entity never enters the world; item carries its stack" }
extra = [
    { name = "item", java = "org.bukkit.inventory.ItemStack", number = 100, reason = "the stack the arrow gives, read-only: a plugin out of process cannot write through the item handle" },
]

[events.AsyncPlayerChat]
collections = ["getRecipients"]

[events.BroadcastMessage]
collections = ["getRecipients"]

[events.PlayerHarvestBlock]
collections = ["getItemsHarvested"]

[events.EntityExplode]
