ServiceUnregister = "the Java service manager is out of scope"

[fired]
InventoryClick = "every click of the player inventory, a vanilla container or a plugin inventory; a spectator's click starts denied and a later handler can let it through; a click in a locked plugin inventory is born cancelled and not asked; a refused click is resent through the generic resync, and set_current_item or set_cursor on a slot or cursor that changed while the event waited refuses the click and resends the window"
InventoryClose = "when the player or the server closes any window, the player inventory included, before the grid and the cursor go back"
CraftItem = "a click on the result of the player grid or of a crafting table whose grid has a recipe, which is its datapack id; the whole window is resent after it"
SmithItem = "a click on the smithing result while it holds an item; the whole window is resent after it"
InventoryCreative = "creative slot packets that place a different item or drop one; ALLOW lets an oversized stack through"
InventoryDrag = "the end of a drag only, the start and the added slots wait in the player lane; a refusal keeps the old cursor and ignores set_cursor"
InventoryOpen = "vanilla containers and plugin inventories, never the player inventory; the open window closes with its InventoryClose before the ask, so a refusal shows no screen"
PrepareItemCraft = "once per click that changes the player grid or a crafting table grid; the client sees no result until the event settles when a decider answers, and a shift-click on the result asks it again between two crafts"
PrepareSmithing = "once per click that changes the inputs into a smithing recipe; the client sees no result until the event settles when a decider answers"
FurnaceBurn = "in a keyed lane per furnace, which stops while it is asked; a refusal leaves the block lit and set_burning false burns without using the fuel, as in Spigot"
FurnaceStartSmelt = "carries the cook time the server uses, with the blast furnace and smoker speed, and a patch sets it as is"
FurnaceSmelt = "also reaches BlockCook handlers; a refusal loses the progress without output, and a patched result unlike the output smelts nothing"
FurnaceExtract = "one per recipe used, also for 0 experience, with the amount taken; a take by number key fires BlockExp instead, as in Spigot, and a furnace break never fires it"
PlayerJoin = "the join message is announced once the event settles"
PlayerQuit = "the quit message is announced once the event settles, after the player is removed"
AsyncPlayerPreLogin = "the login waits for the core; a refusal ends it with the literal kick message"
PlayerLogin = "hostname is empty and the real address is the remote address, neither is tracked"
PlayerKick = "every server-side disconnect of a player in game, never at shutdown or during the login"
PlayerLocaleChange = "at join when the locale is not en_us and on every settings packet that changes it"
PlayerChangedMainHand = "carries the old hand, as the Spigot bytecode does"
PlayerCommandSend = "at join, at respawn and when the operator status changes; only root commands can be removed"
AsyncPlayerChat = "from chat packets and plugin chat orders; the display name is the profile name and there is no chat visibility or text filter"
PlayerCommandPreprocess = "from command packets and plugin chat orders starting with /, not from perform_command"
PlayerMove = "observers and deciding handlers; a changed to moves the player through PlayerTeleport (PLUGIN), only its position applies"
PlayerTeleport = "COMMAND for /tp and PLUGIN for plugin orders and a changed PlayerMove destination; never at respawn"
PlayerVelocity = "at the velocity sync and when a player hits a player; asked only when a deciding handler exists, one at a time"
PlayerRespawn = "DEATH and PLUGIN; there is no bed, anchor or End respawn"
PlayerDeath = "also reaches EntityDeath handlers; the new level fields wait for the respawn"
PlayerInput = "compared with the last input when the packet reaches the head of the lane"
PlayerToggleSneak = "after PlayerInput of the same packet, compared at the head of the lane"
PlayerToggleSprint = "on every start and stop sprinting packet of a loaded client"
PlayerToggleFlight = "only for a player who may fly and changes flight; a cancel resends the abilities"
PlayerGameModeChange = "from /gamemode, the game mode packet, plugin orders and the hardcore respawn; the mode is read at the head of the lane"
PlayerHideEntity = "players only, after the effect of the first plugin hiding them"
PlayerShowEntity = "players only, after the effect of the last plugin showing them"
PlayerItemHeld = "the previous slot is read at the head of the lane; a cancel sends it back"
PlayerAnimation = "ARM_SWING from the punch packet only"
PlayerSwapHandItems = "the items are those after the swap; an outdated swap is refused and resynced"
PlayerInteract = "LEFT_CLICK_AIR, LEFT_CLICK_BLOCK, RIGHT_CLICK_AIR and RIGHT_CLICK_BLOCK; the three sites where Spigot ignores the result ask the deciding handlers and drop their verdicts; no PHYSICAL block exists yet"
PlayerInteractAtEntity = "one fire per entity click, settled once for both handler types"
PlayerInteractEntity = "reached through PlayerInteractAtEntity, as Spigot never builds it alone"
PlayerDropItem = "carries the dropped stack, which a deciding handler may replace; the item entity spawns once settled"
PlayerItemDamage = "fires with 0 for creative players and unbreakable items; every wear is a distinct event, read when it reaches the head of the lane"
PlayerTakeLecternBook = "the book stays on the lectern until the event settles"
PlayerItemBreak = "after the PlayerItemDamage of the same wear"
PlayerExpCooldownChange = "PICKUP_ORB only, as no plugin order sets the cooldown; a negative cooldown blocks the pickup for good, as in Spigot"
PlayerExpChange = "orb pickups only; the amount is the orb value since there is no Mending yet"
PlayerLevelChange = "compared once per tick at the experience sync, from any cause, never at respawn"
PlayerPickupArrow = "arrows that allow pickup only; not asked again for an arrow while a deciding handler answers for it; carries the stack the arrow gives, read-only"
PlayerShearEntity = "sheep only; saddles are sheared without the event, as in Spigot"
BlockDamage = "once per survival dig start; insta_break comes from the mining speed, and a cancel leaves no mining session so the finish is refused"
BlockDamageAbort = "on every release in reach, and out of reach while a mining session runs"
BlockBreak = "creative starts, insta mines and finished survival digs; a finish below 0.7 progress breaks later, once the progress reaches 1; exp_to_drop starts at 0 since no block gives experience yet; a creative tool that cannot break blocks makes it born cancelled"
BlockDropItem = "after every break that keeps its drops, also when empty; each item carries the handle of the item entity it will spawn and its stack, which a deciding handler may replace while keeping a subset; velocity and pickup delay are not exposed"
BlockCanBuild = "for every block item placement that has a state to place; buildable starts as the player obstruction test, mobs are not checked"
BlockPlace = "every item use that changes one block: block items, hoes, axes and shovels; asked before the world changes, so it carries the placed state"
BlockMultiPlace = "doors and tall plants, in Spigot capture order with the upper half first; hand is always HAND"
BlockPhysics = "the notifyAndUpdatePhysics site only, once per block change; a cancel keeps the neighbour shape updates; source_block is the block itself, as in Spigot"
BlockCook = "campfires; a cancel keeps the food and the campfire asks again on its next tick, one ask per campfire at a time"
CampfireStart = "when food goes on a campfire; the recipe is its key and the patched cook time is written without a check, as in Spigot"
BlockExplode = "explosions without a source entity or a causing entity, today the plugin explosion order; the block list patch removes and adds blocks to destroy"
BlockExp = "the experience a furnace kept when its block entity goes and a furnace output taken by number key, one event per recipe used, also for 0"
ChunkLoad = "once a loaded chunk is accepted, at the next tick; the spawn chunks load at startup and reach the plugins already connected"
ChunkPopulate = "right after ChunkLoad for a chunk generated by the load, as Spigot runs no populator of its own"
ChunkUnload = "when a chunk without tickets reaches its unload delay; save_chunk false drops its changes, and a chunk that got a ticket back while asked stays loaded and is not notified"
EntitiesLoad = "after the entities of a loaded chunk are added, also when there is none"
EntitiesUnload = "before the entities of an unloading chunk are saved and removed, never for an autosave"
TimeSkip = "COMMAND for /time add and CUSTOM for the plugin time order; with a deciding handler the time moves once the event settles, by the settled amount, and a cancel keeps it, a documented deviation from Spigot 26.3 which moves it before firing; /time set fires nothing"
WorldInit = "when the server starts its world, before the spawn chunks; the plugin port is already open, so it reaches the plugins connected by then"
WorldLoad = "once the spawn chunks are ready, for the plugins connected by then"
WorldSave = "before /save-all, the plugin save orders and the autosave write, and at shutdown before the final save while plugins are still connected"
SpawnChange = "from /setworldspawn and the plugin spawn order, after the change and only when the spawn moves"
WeatherChange = "from /weather and the plugin weather order when the rain flag changes, before ThunderChange; a cancel keeps the sky and sends nothing, as there is no natural weather cycle or timer"
ThunderChange = "from /weather and the plugin weather order when the thunder flag changes, after WeatherChange settled, each cancellable on its own"
CreatureSpawn = "every creature added to the world: NATURAL, COMMAND, CUSTOM, SPAWNER_EGG, BREEDING, REINFORCEMENTS, DROWNED and FROZEN; a waiting natural spawn holds its slot and a cancel frees it; a plugin spawn question is answered once its spawn settles, refused when cancelled; chunk-loaded entities and players fire nothing"
EntitySpawn = "experience orbs and falling blocks, the entities that are neither creatures, items nor projectiles; its handlers also hear CreatureSpawn, ItemSpawn and ProjectileLaunch"
ItemSpawn = "every item entity added to the world; a cancel discards it without EntityRemove; a plugin drop question is answered once its spawn settles, refused when cancelled"
ProjectileLaunch = "arrows shot by players and skeletons; a cancel discards the arrow"
EntityRemove = "every removal of an entity in the world, before it leaves, with DEATH, DESPAWN, DROP, EXPLODE, HIT, MERGE, OUT_OF_WORLD, PICKUP, PLUGIN, TRANSFORMATION or UNLOAD; fires once per entity, since a removed entity leaves the store and cannot be removed again; never for players or a cancelled spawn"
EntityDropItem = "chicken eggs, sheared wool and saddles, the item of a stopped arrow and of a falling block that cannot land; a cancel keeps the rest of the action"
EntityDamage = "every hurt of a player, a mob or an item entity, asked before the invulnerability window and with a damage of 0; set_damage reruns the armor, resistance and absorption chain; FREEZING, BLOCKING and MAGIC do not exist; a cancel leaves the hit without effect and the attacker hears NODAMAGE"
EntityDamageByEntity = "player and mob melee, sweeps, arrows (the damager is the arrow), creeper explosions and falling blocks; ENTITY_SWEEP_ATTACK never comes out, as in Spigot 26.3"
EntityDamageByBlock = "lava with its block, the void with no block and stalagmites with their tip; a plugin explosion without a source is BLOCK_EXPLOSION with no block; lava and void are asked once per victim while one waits"
EntityDeath = "mob deaths, also when the loot is empty; asked on a snapshot of the loot, the equipment drops and the experience while the mob lies dying, the death applies when the event settles: the settled drops spawn as items, each firing ItemSpawn, then the orbs fire EntitySpawn; PlayerDeath also reaches its handlers"
EntityRegainHealth = "players only: SATIATED from food, REGEN in peaceful, MAGIC from instant health and MAGIC_REGEN from regeneration; mobs never heal yet; a cancelled satiated heal still costs its exhaustion, as in Spigot"
EntityExhaustion = "players who are not invulnerable: DAMAGED, UNKNOWN for an attack, HUNGER_EFFECT, REGEN and BLOCK_MINED; there is no movement or jump exhaustion yet; every exhaustion is asked in turn"
FoodLevelChange = "hunger from exhaustion and the saturation effect; eating and cakes do not exist yet; a cancel keeps the food and resends the health packet"
EntityCombust = "undead burning in daylight; its handlers also hear EntityCombustByBlock and EntityCombustByEntity; a combustion is asked once per entity while one waits"
EntityCombustByBlock = "fire blocks once the fire counter reaches 0 and lava for a living entity that is not burning, with the lava block it touched; burning or non-living entities catch fire from lava without the event, as in Spigot"
EntityCombustByEntity = "a burning arrow before its hit; the combuster is the arrow"
EntityPotionEffect = "COMMAND, PLUGIN, EXPIRATION (also when an effect stops ticking) and DEATH at respawn, for players and mobs; restored effects fire nothing; a cancelled expiration keeps the spent effect and asks again each tick"
EntityKnockback = "the hurt knockback (ENTITY_ATTACK with a direct entity, DAMAGE otherwise, which no damage type of rspigot without a direct entity produces yet), the extra knockback of player and mob attacks (ENTITY_ATTACK), sweeps (SWEEP_ATTACK) and explosions (EXPLOSION); a player hit fires two, a swept target two; the settled final knockback is the new velocity; there is no shield, goat or mace knockback"
EntityKnockbackByEntity = "every knockback whose source is an entity: the direct entity of the hurt, the attacker or the explosion source; reaches EntityKnockback handlers"
ItemDespawn = "an item entity that reaches item-despawn-rate while it ticks; one ask per item while it waits, a cancel resets its age; items do not age while inactive, unlike Spigot"
EntityPickupItem = "players touching an item they can hold, with what does not fit as remaining; one ask per player and item while it waits; mobs never pick up items yet"
EntityChangeBlock = "a falling block leaving its place (before the block turns to air and the entity spawns) and landing (a cancel removes it without placing or dropping), and a grazing sheep (to air also for grass that turns to dirt); without mobGriefing the grazing is born cancelled and asks nobody"
EntityInteract = "a zombie breaking a turtle egg, before the egg goes; there are no pressure plates, farmland or tripwires yet"
CubeMobSplit = "a slime or magma cube of size 2 or more at the end of its death, with the number of children it will split into; a cancel or a count of 0 splits nothing and the cube still goes away; SlimeSplitEvent is its obsolete Bukkit alias"
EntityTransform = "a mob converting into another (SPLIT for the children of a dying cube, listed together, DROWNED, FROZEN, INFECTION, CURED, PIGLIN_ZOMBIFIED and METAMORPHOSIS otherwise); a cancel keeps the old mob, or for a split keeps the children away"
SheepRegrowWool = "after the grazing of a sheep settled, also when it was cancelled; a cancel keeps the sheep sheared"
EntityTeleport = "/tp of a non-player entity asks twice, the command then Entity.teleport, and only the second destination counts, as in Spigot; the first one carries the absolute destination, where Spigot sends the difference on the relative axes, a bug not copied; the plugin teleport order asks once; there are no portals, pearls, endermen or shulkers yet"
ExplosionPrime = "creepers once their fuse ends, one ask per creeper while it waits; a cancel resets the fuse and the creeper lives; the settled radius and fire are the explosion's, a fire flag now sets fire to the crater"
EntityExplode = "explosions with a source or causing entity, after the entities were hurt and pushed; a cancel breaks and sends nothing but keeps the hurts, the push and the fire; the creeper leaves with EXPLODE once it settled"
ProjectileHit = "arrows of players and skeletons: an entity hit is asked and the arrow waits in place, a cancel lets it fly on without damage; a block hit asks its deciders without waiting and drops their verdicts, since its cancel would only skip block reactions that do not exist yet; ExpBottle, PotionSplash and LingeringPotionSplash never reach its handlers"
EntityShootBow = "the drawn bow of a player, whose arrow is spent before the event as in Spigot, and skeletons; a cancel discards the arrow, the player still hears the shot, the skeleton does not; set_projectile to another entity launches nothing; there is no crossbow, Infinity or bow wear"
EntityTarget = "reached through EntityTargetLivingEntity, as Spigot builds the exact class only for the allay, which rspigot lacks"
EntityTargetLivingEntity = "CLOSEST_PLAYER, CLOSEST_ENTITY, FORGOT_TARGET, TARGET_DIED, TARGET_ATTACKED_ENTITY, TARGET_ATTACKED_NEARBY_ENTITY, REINFORCEMENT_TARGET and TEMPT from the AI goals, alerts, reinforcements and experience orbs, only when the target changes; with a deciding handler the change lands one AI pass later, one ask per mob while it waits; the settled target is not revalidated, as in Spigot"
EntityBreed = "cows, pigs, sheep and chickens breeding through their goal, one ask per couple while it waits; the breeder is the online player who fed the mother, then the father; bred_with is the stack in the selected slot once the food is spent, as Animal.setInLove reads it, not saved; a cancel leaves both parents in love"
EntityEnterLoveMode = "feeding an adult cow, pig, sheep or chicken; the food is spent before the event as in Spigot, the settled ticks are written as they are"
SheepDyeWool = "a dye used on a sheep of another colour; the sheep, its colour and the dye change once settled, a cancel resends the hands"
EntityPoseChange = "observer only, once per tick from the pose of each living entity and player that changed since the last tick: DYING of mobs, STANDING and SNEAKING of players (sneaking only when not flying, now also in the pose sent to clients); there is no sleeping, swimming, gliding or mob-specific pose yet"
ServerListPing = "a network hook outside the tick: when no plugin listens the ping answers at once from the configuration, an observed ping answers at once, and a deciding handler makes the answer wait for the settlement within decision-ticks; hidden_players leave the sample and the count, server_icon must be a 64x64 PNG; the answer is capped at 32767 characters by dropping the icon, then cutting the MOTD, and a patched MOTD or icon too long for it is refused; a legacy ping has an empty hostname and no players and ignores the icon and the hidden players; the MOTD goes out as plain text, its section codes are not converted"
ServerLoad = "STARTUP once, when the server starts running, for the plugins connected by then; RELOAD is never fired since there is no reload"
PluginEnable = "when a plugin connects, for the other plugins and never for the plugin itself; a plugin never hears the activations made before it connected; a plugin reconnecting under its name fires PluginDisable for its old connection first"
PluginDisable = "when a plugin disconnects, for the plugins left; at shutdown for every plugin in reverse connection order before the connections close, and every plugin hears the disable of every other one, unlike Spigot which unregisters a disabled plugin's listeners; never for the plugin itself"
ServerCommand = "console lines only, run in the order they were typed; not for dispatched commands, player commands or Ctrl+C; a cancel drops the line silently, and a line that settles after stop does not run"
TabComplete = "players only, for every command and its player name arguments, a superset of Spigot which fires it for Bukkit commands only; an empty or cancelled completion sends no packet, as Spigot; there is no console completion"
BroadcastMessage = "the plugin broadcast order, never /say or /me; the recipients are the console then every player; a broadcast ordered while a handler of a BroadcastMessage runs, deciding or observing, goes out without firing again, and every other one waits behind the broadcasts already asked"

