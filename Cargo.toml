[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "example/plugins/*", "example/proxy-plugins/*"]

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
rspigot-nbt = { path = "crates/rspigot-nbt" }
rspigot-blocks = { path = "crates/rspigot-blocks" }
rspigot-data = { path = "crates/rspigot-data" }
rspigot-domain = { path = "crates/rspigot-domain" }
rspigot-effects = { path = "crates/rspigot-effects" }
rspigot-entities = { path = "crates/rspigot-entities" }
rspigot-items = { path = "crates/rspigot-items" }
rspigot-core = { path = "crates/rspigot-core" }
rspigot-protocol = { path = "crates/rspigot-protocol" }
rspigot-network = { path = "crates/rspigot-network" }
rspigot-ai = { path = "crates/rspigot-ai" }
rspigot-anvil = { path = "crates/rspigot-anvil" }
rspigot-worldgen = { path = "crates/rspigot-worldgen" }
rspigot-auth = { path = "crates/rspigot-auth" }
rspigot-plugin-protocol = { path = "crates/rspigot-plugin-protocol" }
rspigot-plugin = { path = "crates/rspigot-plugin" }
rspigot-plugin-macros = { path = "crates/rspigot-plugin-macros" }
rspigot-plugins = { path = "crates/rspigot-plugins" }
rspigot-proxy-core = { path = "crates/rspigot-proxy-core" }
rspigot-proxy-network = { path = "crates/rspigot-proxy-network" }
rspigot-proxy-plugin = { path = "crates/rspigot-proxy-plugin" }
rspigot-proxy-plugins = { path = "crates/rspigot-proxy-plugins" }
rspigot-management = { path = "crates/rspigot-management" }
rspigot-rcon = { path = "crates/rspigot-rcon" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.rspigot-worldgen]
opt-level = 2
