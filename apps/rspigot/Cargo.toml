[package]
name = "rspigot"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rspigot-anvil = { workspace = true }
rspigot-auth = { workspace = true }
rspigot-core = { workspace = true }
rspigot-data = { workspace = true }
rspigot-domain = { workspace = true }
rspigot-blocks = { workspace = true }
rspigot-nbt = { workspace = true }
rspigot-network = { workspace = true }
rspigot-plugins = { workspace = true }
rspigot-worldgen = { workspace = true }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
serde_json = "1"
uuid = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[lints]
workspace = true
